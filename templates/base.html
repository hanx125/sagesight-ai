<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SageSight AI{% endblock %} - 睿观sagesight-ai分析平台</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%234285f4'/><path d='M50 25 L75 75 L25 75 Z' fill='white'/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260814h">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <!-- 提前定义 SageSight 全局对象和 registerPage 存根，确保内联脚本（content 块中）可在基础脚本加载前注册页面初始化函数 -->
    <script>
        window.SageSight = window.SageSight || {};
        SageSight.pages = SageSight.pages || {};
        SageSight._pending = SageSight._pending || [];
        // 存根：navigation.js 加载后会替换为正式实现，并处理 _pending 队列
        SageSight.registerPage = SageSight.registerPage || function(path, initFn) {
            SageSight._pending.push({ path: path, fn: initFn });
            // 页面已加载完成时立即执行初始化（pjax 场景），否则等 DOMContentLoaded
            if (document.readyState !== 'loading') {
                initFn();
            } else {
                document.addEventListener('DOMContentLoaded', initFn);
            }
        };
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- 通知容器 -->
    <div class="notification-container" style="position: fixed; top: 80px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; align-items: flex-end;"></div>

    <!-- 顶部导航栏 -->
    <header class="top-header">
        <div class="header-left">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor" class="logo-icon">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <h1>睿观 SageSight AI</h1>
            </div>
        </div>

        <!-- 中间导航+标题区域 -->
        <div class="header-center">
            <!-- 左侧导航菜单 -->
            <nav class="header-nav-left">
                <a href="/monitor" class="nav-link {% if request.path == '/monitor' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
                    </svg>
                    <span>驾驶舱</span>
                </a>
                <a href="/tasks" class="nav-link {% if request.path == '/tasks' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                    <span>任务管理</span>
                </a>
                <a href="/cameras" class="nav-link {% if request.path == '/cameras' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                    </svg>
                    <span>流媒体</span>
                </a>
            </nav>

            <!-- 项目标题 -->
            <div class="project-title">
                <div class="title-decoration left"></div>
                <h2 class="title-text">众业宏润安防分析平台</h2>
                <div class="title-decoration right"></div>
            </div>

            <!-- 右侧导航菜单 -->
            <nav class="header-nav-right">
                <a href="/algorithms" class="nav-link {% if request.path == '/algorithms' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    <span>算法库</span>
                </a>
                <a href="/events" class="nav-link {% if request.path == '/events' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span>事件列表</span>
                </a>
                <a href="/system" class="nav-link {% if request.path == '/system' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 S10.02,8.4,12,8.4s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                    </svg>
                    <span>系统管理</span>
                </a>
            </nav>
        </div>

        <!-- 右侧功能区 -->
        <div class="header-right">
            <!-- 主题切换 -->
            <div class="header-theme-toggle" onclick="toggleTheme()" title="切换主题">
                <div class="theme-toggle-track">
                    <div class="theme-toggle-thumb">
                        <svg class="theme-icon-green" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <svg class="theme-icon-light" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- 通知 -->
            <div class="header-notify" id="headerNotify" onclick="event.stopPropagation(); toggleNotifyPanel();" title="通知">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
                <span class="notify-badge" id="notifyBadge" style="display:none;">0</span>
                <!-- 通知下拉面板 -->
                <div class="notify-panel" id="notifyPanel" onclick="event.stopPropagation();">
                    <div class="notify-panel-header">
                        <span class="notify-panel-title">通知</span>
                        <button class="notify-clear-btn" onclick="clearAllNotifications()">全部已读</button>
                    </div>
                    <div class="notify-panel-list" id="notifyPanelList">
                        <div class="notify-empty">暂无通知</div>
                    </div>
                </div>
            </div>

            <!-- 全屏切换 -->
            <div class="header-fullscreen" id="headerFullscreen" onclick="toggleFullscreen()" title="全屏切换">
                <svg class="fullscreen-enter-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
                <svg class="fullscreen-exit-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                </svg>
            </div>

            <!-- 用户登录组件 -->
            <div class="header-user" id="headerUser" onclick="event.stopPropagation(); toggleUserMenu();">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="user-info">
                    <span class="user-name" id="navUserName">加载中...</span>
                    <span class="user-role" id="navUserRole">--</span>
                </div>
                <div class="user-dropdown" id="userDropdownToggle">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 10l5 5 5-5z"/>
                    </svg>
                </div>
                <!-- 下拉菜单 -->
                <div class="user-dropdown-menu" id="userDropdownMenu" style="display:none;" onclick="event.stopPropagation();">
                    <div class="user-menu-header">
                        <div class="user-menu-avatar">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                        </div>
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="menuUserName">--</div>
                            <div class="user-menu-role" id="menuUserRole">--</div>
                        </div>
                    </div>
                    <div class="user-menu-divider"></div>
                    <button class="user-menu-item" onclick="event.stopPropagation(); logout();">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                        </svg>
                        退出登录
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="page-footer">
        <div class="footer-content">
            <span>睿观SageSight AI 安防分析平台 © 众业宏润 2026</span>
            <span class="footer-links">
                <a href="#">帮助文档</a>
                <a href="#">技术支持</a>
            </span>
        </div>
    </footer>

    <!-- ✅ 新增：定时器管理器（必须最先加载） -->
    <script src="{{ url_for('static', filename='js/timer_manager.js') }}?v=20260802"></script>
    <!-- ✅ 新增：性能诊断工具 -->
    <script src="{{ url_for('static', filename='js/performance_monitor.js') }}?v=20260731"></script>
    <!-- ✅ 新增：实时诊断工具 -->
    <script src="{{ url_for('static', filename='js/diagnostic.js') }}?v=20260731"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=20260802"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}?v=20260804"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
