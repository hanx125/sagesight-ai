<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 睿观 SageSight AI</title>
    <style>
        :root {
            --bg: #050b14;
            --card: rgba(11, 21, 36, 0.78);
            --accent: #00e5c3;
            --accent-dim: rgba(0, 229, 195, 0.35);
            --accent-soft: rgba(0, 229, 195, 0.10);
            --accent2: #38bdf8;
            --danger: #ef5350;
            --text: #e8f1f5;
            --muted: rgba(232, 241, 245, 0.52);
            --faint: rgba(232, 241, 245, 0.32);
            --line: rgba(148, 196, 210, 0.14);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* ========================================
           统一全屏动态背景（两层内容共用，无分割）
           ======================================== */
        .bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-orb.o1 {
            width: 560px; height: 560px;
            background: rgba(0, 229, 195, 0.13);
            top: -180px; left: -140px;
            animation: orbDrift1 26s ease-in-out infinite;
        }

        .bg-orb.o2 {
            width: 520px; height: 520px;
            background: rgba(56, 189, 248, 0.11);
            bottom: -200px; right: -120px;
            animation: orbDrift2 32s ease-in-out infinite;
        }

        .bg-orb.o3 {
            width: 380px; height: 380px;
            background: rgba(0, 122, 158, 0.12);
            top: 55%; left: 62%;
            animation: orbDrift3 24s ease-in-out infinite;
        }

        @keyframes orbDrift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(110px, 70px) scale(1.12); }
            66% { transform: translate(50px, -50px) scale(0.94); }
        }

        @keyframes orbDrift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-120px, -80px) scale(1.1); }
        }

        @keyframes orbDrift3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            40% { transform: translate(-90%, -35%) scale(1.18); }
            75% { transform: translate(-20%, -75%) scale(0.92); }
        }

        /* 极淡的全屏远景网格 */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(0, 229, 195, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 195, 0.035) 1px, transparent 1px);
            background-size: 64px 64px;
            -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 30%, transparent 80%);
            mask-image: radial-gradient(ellipse 85% 70% at 50% 45%, #000 30%, transparent 80%);
        }

        /* ========================================
           舞台：左品牌区 + 右表单区（同一背景，无分隔）
           ======================================== */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: flex-end;   /* 整组靠右，登录卡仍在右侧区域 */
            gap: 56px;
            height: 100vh;
            padding: 0 9% 0 4%;
        }

        /* ---------- 品牌区（紧挨登录卡） ---------- */
        .brand-panel {
            width: auto;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0;
        }

        /* 固定宽度：HUD 文案切换时整块宽度不变，避免内容左右跳动 */
        .brand-content {
            width: 440px;
            max-width: 100%;
        }

        .brand-content > * {
            opacity: 0;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            margin-bottom: 34px;
            animation-delay: 0.1s;
        }

        .brand-mark-icon {
            width: 54px;
            height: 54px;
            border-radius: 15px;
            background: linear-gradient(135deg, #00795f 0%, #00e5c3 130%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 12px 34px rgba(0, 229, 195, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            animation: markPulse 4.5s ease-in-out 1.2s infinite;
        }

        .brand-mark-icon svg { width: 31px; height: 31px; color: #04121c; }

        @keyframes markPulse {
            0%, 100% { box-shadow: 0 12px 34px rgba(0, 229, 195, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
            50% { box-shadow: 0 12px 50px rgba(0, 229, 195, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
        }

        .brand-title {
            font-size: clamp(34px, 3.6vw, 46px);
            font-weight: 700;
            letter-spacing: 6px;
            line-height: 1.2;
            animation-delay: 0.22s;
        }

        .brand-title .en {
            display: block;
            font-size: clamp(15px, 1.4vw, 18px);
            font-weight: 600;
            letter-spacing: 5px;
            color: var(--accent);
            margin-top: 10px;
            text-transform: uppercase;
        }

        .brand-tagline {
            margin-top: 22px;
            font-size: 15px;
            color: var(--muted);
            letter-spacing: 3px;
            animation-delay: 0.36s;
        }

        .brand-features {
            list-style: none;
            margin-top: 42px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation-delay: 0.5s;
        }

        .brand-features li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13.5px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .brand-features .dot {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            border-radius: 6px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-features .dot svg { width: 12px; height: 12px; color: var(--accent); }

        /* HUD 状态行 */
        .hud-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 48px;
            font-family: 'Consolas', 'SF Mono', monospace;
            font-size: 11.5px;
            letter-spacing: 2px;
            color: var(--faint);
            white-space: nowrap;
            opacity: 0;
            animation: fadeUp 0.9s ease 0.75s forwards;
        }

        .hud-status .pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: hudPulse 2s ease-in-out infinite;
        }

        @keyframes hudPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* ---------- 登录表单区 ---------- */
        .form-panel {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .form-card {
            width: 400px;
            max-width: 100%;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 40px 38px 30px;
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            opacity: 0;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(26px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 卡片顶部光带 */
        .form-card { position: relative; }

        .form-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 30px;
            right: 30px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
            background-size: 200% 100%;
            animation: lightSweep 6s linear infinite;
            opacity: 0.75;
        }

        @keyframes lightSweep {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 移动端小 logo（桌面隐藏） */
        .form-logo {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .form-logo-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, #00795f 0%, #00e5c3 130%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(0, 229, 195, 0.25);
        }

        .form-logo-icon svg { width: 28px; height: 28px; color: #04121c; }

        .form-heading {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .form-sub {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        /* 表单 */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 28px;
        }

        .input-group { position: relative; }

        .input-group > svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 19px;
            height: 19px;
            color: var(--faint);
            transition: color 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 14px 46px 14px 46px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            outline: none;
        }

        .input-group input::placeholder { color: var(--faint); letter-spacing: 1px; }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent-dim);
            box-shadow: 0 0 0 4px rgba(0, 229, 195, 0.10), 0 0 22px rgba(0, 229, 195, 0.08);
        }

        .input-group:focus-within > svg { color: var(--accent); }

        /* 修复浏览器自动填充（autofill）后输入框背景变为浅色的问题 */
        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover,
        .input-group input:-webkit-autofill:focus,
        .input-group input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px rgb(18, 30, 48) inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff;
            transition: background-color 9999s ease-in-out 0s;
        }

        /* 密码可见切换 */
        .password-toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--faint);
            transition: color 0.3s ease;
            background: none;
            border: none;
            padding: 4px;
            display: flex;
        }

        .password-toggle:hover { color: var(--accent); }
        .password-toggle svg { width: 19px; height: 19px; }

        /* 错误提示 */
        .login-error {
            background: rgba(239, 83, 80, 0.10);
            border: 1px solid rgba(239, 83, 80, 0.35);
            color: var(--danger);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 9px;
            margin-top: 22px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .login-error svg { width: 17px; height: 17px; flex-shrink: 0; }

        /* ========================================
           滑动验证
           ======================================== */
        .slide-verify {
            position: relative;
            width: 100%;
            height: 46px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            overflow: hidden;
            user-select: none;
        }

        .slide-verify-track {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--faint);
            transition: color 0.3s ease;
        }

        .slide-verify-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, rgba(0, 229, 195, 0.14) 0%, rgba(0, 229, 195, 0.26) 100%);
            transition: width 0s;
        }

        .slide-verify-handle {
            position: absolute;
            top: 3px;
            left: 0;
            width: 40px;
            height: 38px;
            border-radius: 9px;
            background: linear-gradient(135deg, #009477 0%, #00e5c3 120%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            z-index: 2;
            box-shadow: 0 3px 12px rgba(0, 229, 195, 0.35);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .slide-verify-handle:active { cursor: grabbing; }

        .slide-verify-handle svg { width: 19px; height: 19px; color: #04121c; }

        .slide-verify.success {
            border-color: rgba(76, 175, 80, 0.5);
            background: rgba(76, 175, 80, 0.07);
        }

        .slide-verify.success .slide-verify-progress {
            width: 100% !important;
            background: linear-gradient(90deg, rgba(76, 175, 80, 0.16) 0%, rgba(76, 175, 80, 0.30) 100%);
        }

        .slide-verify.success .slide-verify-handle {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 120%);
            box-shadow: 0 3px 12px rgba(76, 175, 80, 0.4);
            cursor: default;
        }

        .slide-verify.success .slide-verify-handle svg { color: #ffffff; }
        .slide-verify.success .slide-verify-track { color: #66bb6a; }

        .slide-verify.fail .slide-verify-handle {
            animation: slideShake 0.4s ease;
            background: linear-gradient(135deg, #c62828 0%, #ef5350 120%);
        }

        @keyframes slideShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00a981 0%, #00e5c3 120%);
            border: none;
            border-radius: 12px;
            color: #04121c;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 6px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
            position: relative;
            overflow: hidden;
            margin-top: 4px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 229, 195, 0.35);
            filter: brightness(1.06);
        }

        .login-btn:active:not(:disabled) { transform: translateY(0); }

        .login-btn:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        /* 按钮流光 */
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -80%;
            width: 50%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            animation: btnSheen 3.2s ease-in-out 1.4s infinite;
        }

        @keyframes btnSheen {
            0% { left: -80%; }
            45%, 100% { left: 130%; }
        }

        .login-btn-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(4, 18, 28, 0.3);
            border-top-color: #04121c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* SSO 分隔线与云平台单点登录按钮 */
        .sso-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
            font-size: 11.5px;
            letter-spacing: 2px;
            color: var(--faint);
        }

        .sso-divider::before,
        .sso-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .sso-btn {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--accent-dim);
            border-radius: 12px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
        }

        .sso-btn:hover {
            background: var(--accent-soft);
            box-shadow: 0 8px 24px rgba(0, 229, 195, 0.18);
            transform: translateY(-1px);
        }

        .sso-btn:disabled { opacity: 0.5; cursor: wait; }

        .sso-btn svg { width: 17px; height: 17px; flex-shrink: 0; }

        /* 底部提示 */
        .login-hint {
            margin-top: 22px;
            padding: 11px 14px;
            background: var(--accent-soft);
            border: 1px solid rgba(0, 229, 195, 0.18);
            border-radius: 10px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .login-hint code {
            color: var(--accent);
            font-family: 'Consolas', monospace;
        }

        .login-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 11.5px;
            letter-spacing: 1.5px;
            color: var(--faint);
        }

        /* ========================================
           响应式：窄屏隐藏品牌区
           ======================================== */
        @media (max-width: 1180px) {
            .stage { gap: 36px; padding: 0 6% 0 3%; }
            .brand-content { width: 380px; }
        }

        @media (max-width: 920px) {
            .brand-panel { display: none; }
            .form-logo { display: flex; }
            .form-card { padding: 34px 28px 26px; }
            .stage { justify-content: center; gap: 0; padding: 0 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- 统一全屏动态背景 -->
    <canvas class="bg-canvas" id="particleCanvas"></canvas>
    <div class="bg-orb o1"></div>
    <div class="bg-orb o2"></div>
    <div class="bg-orb o3"></div>
    <div class="bg-grid"></div>

    <div class="stage">
        <!-- 左侧品牌区（与表单共用同一背景，无分隔线） -->
        <aside class="brand-panel">
            <div class="brand-content">
                <div class="brand-mark">
                    <div class="brand-mark-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-5.6l2.3 2.3a1 1 0 0 1-1.4 1.4L12 16.4l-3.3 3.3a1 1 0 0 1-1.4-1.4L9.6 16H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v8h14V6H5zm4.9 1.6l3.6 2.1a.7.7 0 0 1 0 1.2l-3.6 2.1a.7.7 0 0 1-1-.6V8.2a.7.7 0 0 1 1-.6z"/>
                        </svg>
                    </div>
                </div>
                <h1 class="brand-title">
                    睿观
                    <span class="en">SageSight AI</span>
                </h1>
                <p class="brand-tagline">让每一帧画面都被理解</p>
                <ul class="brand-features">
                    <li>
                        <span class="dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></span>
                        实时目标检测与跟踪
                    </li>
                    <li>
                        <span class="dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
                        人脸 · 车牌智能比对
                    </li>
                    <li>
                        <span class="dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9zm-4.3 13a2 2 0 0 1-3.4 0"/></svg></span>
                        事件秒级告警推送
                    </li>
                </ul>
                <div class="hud-status">
                    <span class="pulse"></span>
                    <span id="hudText">SYS ONLINE · 模型已加载 · 通道正常</span>
                </div>
            </div>
        </aside>

        <!-- 右侧表单区 -->
        <main class="form-panel">
            <div class="form-card">
                <div class="form-logo">
                    <div class="form-logo-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-5.6l2.3 2.3a1 1 0 0 1-1.4 1.4L12 16.4l-3.3 3.3a1 1 0 0 1-1.4-1.4L9.6 16H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v8h14V6H5zm4.9 1.6l3.6 2.1a.7.7 0 0 1 0 1.2l-3.6 2.1a.7.7 0 0 1-1-.6V8.2a.7.7 0 0 1 1-.6z"/>
                        </svg>
                    </div>
                </div>

                <h2 class="form-heading">欢迎回来</h2>
                <p class="form-sub">登录以进入推理分析平台</p>

                <div class="login-error" id="loginError">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span id="loginErrorMsg">用户名或密码错误</span>
                </div>

                <form class="login-form" id="loginForm" onsubmit="return false;">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" value="">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" value="">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePassword()">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- 滑动验证 -->
                    <div class="slide-verify" id="slideVerify">
                        <div class="slide-verify-progress" id="slideProgress"></div>
                        <div class="slide-verify-track" id="slideTrack">请按住滑块，拖动到最右端</div>
                        <div class="slide-verify-handle" id="slideHandle">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                            </svg>
                        </div>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn" onclick="handleLogin()" disabled>
                        <span id="loginBtnText">登 录</span>
                        <div class="login-btn-spinner" id="loginSpinner"></div>
                    </button>
                </form>

                {% if sso_enabled %}
                <div class="sso-divider">或</div>
                <button type="button" class="sso-btn" id="ssoBtn" onclick="handleSSOLogin()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.1c1.56.1 2.78 1.41 2.78 2.97 0 1.65-1.35 3-3 3z"/>
                    </svg>
                    云平台单点登录
                </button>
                {% endif %}

                <div class="login-hint">
                    默认账户: <code>admin</code> / <code>admin123</code>
                </div>

                <div class="login-footer">
                    © 2026 SageSight AI · 推理分析平台
                </div>
            </div>
        </main>
    </div>

    <script>
        // ========================================
        // 全屏星点粒子 + 近距连线（统一背景）
        // ========================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let cw = 0, ch = 0;

        function resizeCanvas() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = Array.from({ length: 70 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            s: 0.6 + Math.random() * 1.6,
            vx: (Math.random() - 0.5) * 0.12,
            vy: (Math.random() - 0.5) * 0.12,
            o: 0.25 + Math.random() * 0.5,
            tw: Math.random() * Math.PI * 2,
            tv: 0.01 + Math.random() * 0.02,
        }));

        // ========================================
        // 检测取景框：周期性出现 → 锁定展开 → 漂移 → 淡出换位
        // ========================================
        const DET_LABELS = ['行人 0.98', '人脸 0.93', '车辆 0.96', '车牌 0.91', '非机动车 0.89'];

        class DetectionBox {
            constructor(delay) {
                this.life = -delay;
                this.spawn(true);
            }

            spawn(keep) {
                const m = 50;
                this.w = 90 + Math.random() * 110;
                this.h = 110 + Math.random() * 130;
                this.x = m + Math.random() * Math.max(1, cw - this.w - m * 2);
                this.y = m + Math.random() * Math.max(1, ch - this.h - m * 2);
                this.label = DET_LABELS[Math.floor(Math.random() * DET_LABELS.length)];
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.maxLife = 240 + Math.random() * 160;
                if (!keep) this.life = 0;
            }

            update() {
                this.life++;
                if (this.life > 0) { this.x += this.vx; this.y += this.vy; }
                if (this.life > this.maxLife) this.spawn(false);
            }

            draw() {
                if (this.life <= 0) return;
                const appear = Math.min(1, this.life / 22);
                const fade = Math.min(1, (this.maxLife - this.life) / 22);
                const a = Math.min(appear, fade) * 0.55;
                // 锁定：从中心向外展开
                const scale = 0.72 + 0.28 * appear;
                const w = this.w * scale, h = this.h * scale;
                const x = this.x + (this.w - w) / 2, y = this.y + (this.h - h) / 2;

                ctx.save();
                ctx.globalAlpha = a;
                ctx.strokeStyle = 'rgba(0, 229, 195, 0.9)';
                ctx.lineWidth = 1.4;

                // 四角 L 形角标
                const c = Math.min(16, w / 4);
                ctx.beginPath();
                ctx.moveTo(x, y + c); ctx.lineTo(x, y); ctx.lineTo(x + c, y);
                ctx.moveTo(x + w - c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + c);
                ctx.moveTo(x + w, y + h - c); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - c, y + h);
                ctx.moveTo(x + c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - c);
                ctx.stroke();

                // 极细整框
                ctx.globalAlpha = a * 0.22;
                ctx.strokeRect(x, y, w, h);

                // 置信度标签
                ctx.globalAlpha = a;
                ctx.font = '11px Consolas, monospace';
                const tw = ctx.measureText(this.label).width;
                ctx.fillStyle = 'rgba(0, 229, 195, 0.16)';
                ctx.fillRect(x, y - 18, tw + 14, 16);
                ctx.fillStyle = 'rgba(0, 229, 195, 0.95)';
                ctx.fillText(this.label, x + 7, y - 6);

                // 角标点
                ctx.fillStyle = 'rgba(0, 229, 195, 0.9)';
                ctx.fillRect(x - 2, y - 2, 4, 4);
                ctx.restore();
            }
        }

        const detBoxes = [new DetectionBox(0), new DetectionBox(140), new DetectionBox(300)];

        function drawScene() {
            ctx.clearRect(0, 0, cw, ch);

            for (const st of stars) {
                st.x += st.vx; st.y += st.vy; st.tw += st.tv;
                if (st.x < 0) st.x = cw; if (st.x > cw) st.x = 0;
                if (st.y < 0) st.y = ch; if (st.y > ch) st.y = 0;
            }

            for (let i = 0; i < stars.length; i++) {
                const a = stars[i];
                for (let j = i + 1; j < stars.length; j++) {
                    const b = stars[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = dx * dx + dy * dy;
                    if (dist < 130 * 130) {
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(0, 229, 195, ${0.10 * (1 - Math.sqrt(dist) / 130)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            for (const st of stars) {
                const twinkle = 0.65 + 0.35 * Math.sin(st.tw);
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.s, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(140, 235, 218, ${st.o * twinkle})`;
                ctx.fill();
            }

            // 检测取景框
            for (const b of detBoxes) { b.update(); b.draw(); }

            requestAnimationFrame(drawScene);
        }
        drawScene();

        // HUD 状态轮播
        const HUD_MESSAGES = [
            'SYS ONLINE · 模型已加载 · 通道正常',
            'DETECTING · 人脸比对中 · 车牌识别中',
            'STREAMING · 实时分析运行中',
        ];
        let hudIdx = 0;
        setInterval(() => {
            hudIdx = (hudIdx + 1) % HUD_MESSAGES.length;
            document.getElementById('hudText').textContent = HUD_MESSAGES[hudIdx];
        }, 5000);

        // ========================================
        // 滑动验证逻辑
        // ========================================
        let slideVerified = false;
        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        let maxWidth = 0;

        const slideVerify = document.getElementById('slideVerify');
        const slideHandle = document.getElementById('slideHandle');
        const slideProgress = document.getElementById('slideProgress');
        const slideTrack = document.getElementById('slideTrack');

        function initSlideVerify() {
            maxWidth = slideVerify.offsetWidth - slideHandle.offsetWidth - 6;
            slideHandle.addEventListener('mousedown', startDrag);
            slideHandle.addEventListener('touchstart', startDrag, { passive: false });
            document.getElementById('loginBtn').disabled = true;
        }

        function startDrag(e) {
            if (slideVerified) return;
            e.preventDefault();

            isDragging = true;
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            currentX = 0;

            slideTrack.textContent = '正在验证...';
            slideVerify.classList.remove('fail');

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchmove', onDrag, { passive: false });
            document.addEventListener('touchend', endDrag);
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();

            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let x = clientX - startX;

            if (x < 0) x = 0;
            if (x > maxWidth) x = maxWidth;

            currentX = x;
            slideHandle.style.left = x + 'px';
            slideProgress.style.width = (x + 40) + 'px';

            const percent = Math.round((x / maxWidth) * 100);
            if (percent < 100) {
                slideTrack.textContent = `验证中 ${percent}%`;
            }
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;

            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('touchend', endDrag);

            if (currentX >= maxWidth - 2) {
                slideVerified = true;
                slideVerify.classList.add('success');
                slideVerify.classList.remove('fail');
                slideTrack.textContent = '验证通过';
                slideHandle.style.left = maxWidth + 'px';
                slideProgress.style.width = '100%';

                document.getElementById('loginBtn').disabled = false;
                document.getElementById('password').focus();
            } else {
                slideVerify.classList.add('fail');
                slideTrack.textContent = '验证失败，请重试';

                setTimeout(() => {
                    slideHandle.style.transition = 'left 0.3s ease';
                    slideProgress.style.transition = 'width 0.3s ease';
                    slideHandle.style.left = '0px';
                    slideProgress.style.width = '0px';

                    setTimeout(() => {
                        slideHandle.style.transition = '';
                        slideProgress.style.transition = '';
                        slideVerify.classList.remove('fail');
                        slideTrack.textContent = '请按住滑块，拖动到最右端';
                    }, 300);
                }, 600);
            }
        }

        function resetSlideVerify() {
            slideVerified = false;
            slideHandle.style.transition = 'left 0.3s ease';
            slideProgress.style.transition = 'width 0.3s ease';
            slideHandle.style.left = '0px';
            slideProgress.style.width = '0px';
            slideVerify.classList.remove('success', 'fail');
            slideTrack.textContent = '请按住滑块，拖动到最右端';

            setTimeout(() => {
                slideHandle.style.transition = '';
                slideProgress.style.transition = '';
            }, 300);

            document.getElementById('loginBtn').disabled = true;
        }

        window.addEventListener('resize', function() {
            maxWidth = slideVerify.offsetWidth - slideHandle.offsetWidth - 6;
        });

        initSlideVerify();

        // ========================================
        // 登录逻辑
        // ========================================
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.52-.8l3.15 3.15.02-.15c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        function showError(msg) {
            const errorEl = document.getElementById('loginError');
            document.getElementById('loginErrorMsg').textContent = msg;
            errorEl.style.display = 'flex';
            errorEl.style.animation = 'none';
            errorEl.offsetHeight;
            errorEl.style.animation = 'shake 0.4s ease';
        }

        function hideError() {
            document.getElementById('loginError').style.display = 'none';
        }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!slideVerified) {
                showError('请先完成滑动验证');
                return;
            }

            if (!username || !password) {
                showError('用户名和密码不能为空');
                return;
            }

            hideError();

            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '/';
                    window.location.href = redirectUrl;
                } else {
                    showError(data.error || '登录失败');
                    resetSlideVerify();
                    btn.disabled = false;
                    btnText.style.display = 'inline';
                    spinner.style.display = 'none';
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                resetSlideVerify();
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        // 云平台单点登录（popup 弹窗模式）：主窗口停留在登录页，授权动作在弹窗内完成；
        // 弹窗最后落在回调页，由回调页 postMessage 把结果回传给本窗口。
        async function handleSSOLogin() {
            const btn = document.getElementById('ssoBtn');
            if (btn) btn.disabled = true;
            // 在同一用户点击事件内同步打开空白弹窗，规避浏览器对"异步后 window.open"的拦截；
            // 弹窗尺寸贴合云侧授权卡片（宽约 480、高约 510~530，留余量取 560×680，居中弹出）
            const popupWidth = 560, popupHeight = 680;
            const popupLeft = Math.max(0, Math.round((window.screen.availWidth - popupWidth) / 2));
            const popupTop = Math.max(0, Math.round((window.screen.availHeight - popupHeight) / 2));
            const popup = window.open('', 'ssoPopup',
                `width=${popupWidth},height=${popupHeight},left=${popupLeft},top=${popupTop},` +
                'menubar=no,toolbar=no,location=no,status=no');
            const fail = (msg) => {
                if (popup && !popup.closed) popup.close();
                showError(msg);
                if (btn) btn.disabled = false;
            };
            try {
                const resp = await fetch('/api/auth/sso/login');
                const data = await resp.json();
                if (!resp.ok || !data.url) {
                    fail(data.error || '单点登录发起失败');
                    return;
                }
                if (popup && !popup.closed) {
                    popup.location.href = data.url;
                } else {
                    // 弹窗被拦截，回退整页跳转（回调页检测无 opener 时会自动跳转）
                    window.location.href = data.url;
                }
            } catch (e) {
                fail('单点登录发起失败');
            }
        }

        // 监听 SSO 弹窗回传的授权结果：仅处理来自回调页的 postMessage。
        // 成功 → 本地会话已由回调建立，主窗口进入首页；失败 → 登录页提示。
        window.addEventListener('message', (event) => {
            const payload = event.data;
            if (!payload || payload.source !== 'sso-callback') return;
            if (payload.type === 'success') {
                // 会话 Cookie 建立在回调页主机上；主窗口当前主机与之一致时
                // payload.redirect 就是本站 '/'，不一致（localhost 与 IP 混用）时
                // 跳到回调主机来源，否则当前主机无会话会被踢回登录页。
                const target = (typeof payload.redirect === 'string' && /^https?:\/\//.test(payload.redirect))
                    ? payload.redirect : '/';
                window.location.replace(target);
            } else {
                showError('单点登录未完成' + (payload.message ? ': ' + payload.message : ''));
                const btn = document.getElementById('ssoBtn');
                if (btn) btn.disabled = false;
            }
        });

        // SSO 回调失败提示（/login?sso_error=...）
        (function () {
            const ssoErr = new URLSearchParams(window.location.search).get('sso_error');
            if (ssoErr) showError('单点登录失败: ' + ssoErr);
        })();
    </script>
</body>
</html>
