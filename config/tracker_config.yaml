# ========================================
# Norfair 跟踪器配置文件
# ========================================
# 基于 Norfair 框架的多目标跟踪，配合 Frigate 架构的 Region 检测使用。
#
# 硬件配置：NVIDIA RTX 2070 (8GB) | CUDA 12.9 | Python 3.11 | 32GB RAM
#
# 核心特性：
# - Kalman 滤波预测 + IoU 距离匹配
# - 静止/活动状态判断（基于历史框 IoU）
# - 轨迹历史维护（用于事件轨迹绘制）
# - 支持 Zone 区域过滤
# - 支持 PTZ 自动跟踪（通过 PTZMetrics 共享状态）
#
# 适用场景：
# - 车辆跟踪（交通监控）
# - 行人跟踪（安防监控）
# - 通用多目标跟踪

# ========================================
# 跟踪器全局配置
# ========================================

# 是否启用跟踪功能
# 说明：跟踪功能可以为检测目标分配唯一ID，并维护轨迹历史
# - true: 启用跟踪功能（初始化 NorfairTracker）
# - false: 禁用跟踪功能（只做检测，不做跟踪）
#
# ⚠️ 注意：enabled 是任务表的单独字段（tracking_enabled），不从配置文件读取
# 此处仅作为说明，实际启用/禁用由任务表的 tracking_enabled 字段控制
# enabled: true

# 跟踪器类型（固定为 norfair，仅当 tracking_enabled=true 时生效）
# 说明：当前仅支持 Norfair 跟踪器，未来可扩展其他跟踪器
tracker_type: norfair

# ========================================
# 调试配置
# ========================================
# 调试信息打印间隔（帧数，设为 0 禁用调试日志）
# 说明：每 N 帧输出一次跟踪状态信息（用于调试）
# - 0: 禁用调试日志（推荐，生产环境）
# - 10: 每 10 帧输出一次（调试时使用）
# - 1: 每帧输出一次（详细调试）
debug_print_interval: 0

# ========================================
# Norfair 核心配置
# ========================================
norfair:
  # ========================================
  # 轨迹管理参数（用户配置）
  # ========================================

  # 新轨迹确认帧数（min_initialized）
  # 说明：目标连续被检测到该帧数后才确认为有效轨迹
  # 推荐值：
  #   - 3: 默认推荐值（平衡确认速度和稳定性）
  #   - 1: 快速确认（适合快速移动场景，但可能引入误检）
  #   - 5: 慢速确认（适合高精度场景，避免误检）
  #
  # ⚠️ 影响：
  #   - 值越小：轨迹确认越快，但可能引入误检（短暂检测也会创建轨迹）
  #   - 值越大：轨迹确认越慢，但更稳定（过滤短暂检测）
  min_initialized: 3

  # 最大丢失帧数（max_disappeared）
  # 说明：目标连续丢失该帧数后注销轨迹
  # 推荐值：
  #   - 30: 默认推荐值（约1秒，适合一般场景）
  #   - 10: 快速注销（适合快速移动场景，避免ID滥用）
  #   - 60: 慢速注销（适合遮挡恢复场景，如车辆穿过遮挡物）
  #
  # ⚠️ 影响：
  #   - 值越小：轨迹快速消失，适合快速移动场景（避免ID滥用）
  #   - 值越大：轨迹保留更久，适合遮挡恢复场景（同一目标ID保留更久）
  max_age: 30

  # ========================================
  # 静止/活动状态判断参数（任务表配置）
  # ========================================
  # 以下参数不在本文件配置，由任务表（task_config）提供：

  # 静止判断阈值（stationary_threshold）
  # 说明：motionless_count 超过此值认为目标静止
  # 推荐值：10-20
  # - 10: 默认值（约0.4秒静止后判定）
  # - 5: 快速判定静止（适合高动态场景）
  # - 20: 慢速判定静止（适合静态场景）

  # 静止对象最大停留帧数（max_frames）
  # 说明：超过该帧数的静止目标会被注销，用于避免长期占用跟踪ID
  # 格式：dict {label: frames} 或 {"default": frames}
  # 例如：
  #   max_frames:
  #     default: 300  # 默认：300帧（约12秒）
  #     person: 600   # 行人：600帧（约24秒）
  #     car: 1200     # 车辆：1200帧（约48秒）

  # 检测分数阈值（threshold）
  # 说明：从 detector_config.conf_threshold 继承，用于 false_positive 判断

  # ========================================
  # IoU 匹配阈值（固定值，不可配置）
  # ========================================
  # IoU 匹配阈值固定为 0.7（distance_threshold）
  # 说明：等价于 IoU > 0.3 即可匹配，适配大多数场景
  #
  # 匹配逻辑：
  # - IoU > 0.3: 可以匹配（distance < 0.7）
  # - IoU > 0.5: 良好匹配（distance < 0.5）
  # - IoU > 0.7: 优秀匹配（distance < 0.3）
  #
  # ⚠️ 此阈值经过大量场景验证，适配大多数场景，无需在配置文件暴露

# ========================================
# Kalman 滤波参数（固定值，不可配置）
# ========================================
# Norfair 使用 OptimizedKalmanFilterFactory(R=3.4)
# R 参数控制观测噪声协方差，值越大对新观测越信任
# 3.4 是经过大量场景验证的最优值，无需调整

# ========================================
# 距离函数（固定实现）
# ========================================
# 距离函数考虑以下因素：
# 1. 底中心点位置的相对位移（按框尺寸归一化）
# 2. 宽高比的变化
# 3. 变化向量的欧几里得距离
#
# 此距离函数适配大多数跟踪场景，无需调整

# ========================================
# 静止/活动状态判断逻辑
# ========================================
# 状态判断基于历史框 IoU：
# 1. 维护 stationary_box_history（最近 MAX_STATIONARY_HISTORY=10 个框）
# 2. 计算当前框与历史平均框的 IoU
# 3. IoU 高 → 目标静止 → motionless_count++
# 4. IoU 低 → 目标移动 → motionless_count=0, position_changes++
# 5. motionless_count 超过 stationary_threshold → 判定为静止状态
#
# IoU 阈值（固定值，不可配置）：
# - THRESHOLD_KNOWN_ACTIVE_IOU = 0.2（已知活动判定）
# - THRESHOLD_STATIONARY_CHECK_IOU = 0.6（静止检查）
# - THRESHOLD_ACTIVE_CHECK_IOU = 0.9（活动检查）

# ========================================
# PTZ 自动跟踪接口（可选）
# ========================================
# 当 ptz_metrics.autotracker_enabled 为 True 时，启用 PTZ 自动跟踪
# 使用 coord_transformations 补偿相机运动
#
# 说明：
# - PTZ 自动跟踪需要硬件支持（云台摄像头）
# - 需要配置 ptz_service.py（PTZ 控制服务）
# - PtzMotionEstimator 后续实现完整 autotrack

# ========================================
# 轨迹历史配置（固定值）
# ========================================
# 轨迹历史长度：max_trajectory_length = 100 帧
# 说明：存储端保留足够长度，显示端按 display_config.trajectory_history_length 截取
#
# ⚠️ 此值经过大量场景验证，适配大多数跟踪场景，无需调整

# ========================================
# 性能优化建议
# ========================================
# 1. 轨迹管理优化：
#    - 调整 min_initialized（如 1），快速确认轨迹（适合快速移动场景）
#    - 调整 max_age（如 60），延长轨迹保留时间（适合遮挡恢复场景）
#
# 2. 静止对象清理优化：
#    - 配置 max_frames（任务表），定期清理长期静止的目标
#    - 避免静止目标长期占用跟踪 ID
#
# 3. 调试优化：
#    - 设置 debug_print_interval=10，输出跟踪状态信息（调试时）
#    - 设置 debug_print_interval=0，禁用调试日志（生产环境）

# ========================================
# 典型场景配置示例
# ========================================
# 场景1：室内行人跟踪（快速移动）
#   min_initialized: 3
#   max_age: 30
#   stationary_threshold: 10（任务表）
#   max_frames: {"default": 600, "person": 300}（任务表）
#
# 场景2：室外车辆跟踪（遮挡恢复）
#   min_initialized: 5
#   max_age: 60
#   stationary_threshold: 20（任务表）
#   max_frames: {"default": 1200, "car": 600}（任务表）
#
# 场景3：高精度跟踪（避免误检）
#   min_initialized: 5
#   max_age: 20
#   stationary_threshold: 15（任务表）
#   max_frames: {"default": 300}（任务表）