# ========================================
# BoT-SORT 跟踪器配置文件
# ========================================
# BoT-SORT = ByteTrack + DeepSORT + 改进卡尔曼滤波
# 
# 核心特性：
# - 改进卡尔曼滤波（使用 h_ratio 状态向量）
# - 三阶段匹配策略（IoU + ReID 融合）
# - 外观特征重识别（可选）
# 
# 性能：MOT17 排名第一（MOTA=80.5, IDF1=80.2, HOTA=65.0）
# 
# 适用场景：
# - 车辆跟踪（推荐）
# - 行人跟踪
# - 通用多目标跟踪

# ========================================
# 跟踪器全局配置
# ========================================

# 是否启用跟踪功能
# - true: 启用跟踪功能（初始化 BoT-SORT 跟踪器）
# - false: 禁用跟踪功能（只做检测，不做跟踪）
#enabled: true

# 跟踪器类型（仅当 enabled=true 时生效）
tracker_type: botsort

# ========================================
# 调试配置
# ========================================
debug_print_interval: 0  # 调试信息打印间隔（帧数，设为 0 禁用调试日志）

# ========================================
# BoT-SORT 核心配置
# ========================================
botsort:
  # === 检测阈值 ===
  track_thresh: 0.30          # 高分检测阈值（提高到 0.30，过滤不稳定检测）
  low_score_thresh: 0.10      # 低分检测阈值（提高到 0.10，减少噪声）
  
  # === 匹配阈值 ===
  match_thresh: 0.50          # IoU 匹配阈值（降低到 0.50，需要更高 IoU 才能匹配）
  
  # === 轨迹管理 ===
  max_age: 45                 # 最大丢失帧数（增加到 45帧，提高遮挡恢复能力）
  n_init: 2                   # 新轨迹确认帧数（降低到 2，加快轨迹确认）
  
  # === 轨迹历史 ===
  max_history_length: 30      # 轨迹历史长度（15帧 ≈ 1.2秒，轨迹线更短）
  
  # === ReID 配置（可选）===
  use_reid: false             # 是否使用 ReID 外观特征（车辆跟踪不需要）
  reid_model_type: 'none'     # ReID 模型类型：'none', 'osnet', 'torchreid'
  reid_model_path: ''         # ReID 模型路径
  reid_thresh: 0.3            # ReID 匹配阈值（余弦距离）
  
  # === 设备配置 ===
  device: 'cpu'               # 设备：'cpu', 'cuda'
  half: false                 # 是否使用半精度（FP16）

# ========================================
# 说明
# ========================================
# 1. 如果 use_reid=false，BoT-SORT 只使用 IoU 匹配（类似 ByteTrack）
# 2. 如果 use_reid=true，需要安装 ReID 模型：
#    - FastReID: pip install fastreid
#    - OSNet: pip install torchreid
# 3. ReID 模型会显著提高 ID 精度，但会增加计算开销
# 4. 推荐使用 use_reid=false，BoT-SORT 仍然比 ByteTrack 更稳定

# ========================================
# 参数调优建议
# ========================================
# 
# === 检测阈值 ===
# track_thresh: 0.5（推荐）
#   - 值越小：更多检测参与匹配，但可能引入误检
#   - 值越大：匹配更严格，但可能丢失低分检测
# 
# === 匹配阈值 ===
# match_thresh: 0.8（推荐）
#   - 值越小：匹配更严格（需要更高 IoU）
#   - 值越大：匹配更宽松（允许更低 IoU）
# 
# === 轨迹管理 ===
# max_age: 30（推荐）
#   - 值越小：轨迹快速消失，适合快速移动场景
#   - 值越大：轨迹保留更久，适合遮挡场景
# 
# === 轨迹历史 ===
# max_history_length: 30（推荐）
#   - 值越小：轨迹线更短，适合快速移动场景
#   - 值越大：轨迹线更长，适合慢速移动场景