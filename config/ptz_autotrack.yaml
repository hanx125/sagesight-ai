# ========================================
# PTZ 自动跟踪配置
# ========================================
# 作用：目标被锁定后，云台自动转动把它保持在画面中心。
#
# 数据流（跨进程）：
#   任务子进程 TrackedObjectProcessor
#     → 写 PTZMetrics（目标归一化中心点/宽高）
#   主进程 PTZAutoTrackService（本配置的服务）
#     → 读目标位置 → 算速度 → PTZController.move_velocity()
#     → 写回 motor_moving
#   任务子进程 NorfairTracker
#     → 读 motor_moving，转动期间放宽 IoU 匹配阈值，避免目标 ID 断裂
#
# ⚠️ 只做 pan/tilt，不做自动变焦。变焦会改变目标尺度，跨帧匹配更难稳定。

ptz_autotrack:
  # 总开关。关闭后服务线程不启动，任务侧也不会创建 PTZMetrics
  enabled: true

  # 控制周期（秒）。太小会让 ONVIF 请求堆积，太大跟不上目标
  tick_interval: 0.2

  # ========================================
  # 死区（归一化画面比例）
  # ========================================
  # 目标中心落在中心 ±deadzone 的矩形内就不动云台。
  # 太小 → 云台持续微调、画面抖；太大 → 目标偏离明显才动，跟拍感差。
  deadzone_x: 0.12
  deadzone_y: 0.12

  # ========================================
  # 速度映射
  # ========================================
  # 目标偏离死区后，偏移量线性映射到 [speed_min, speed_max]。
  # speed_min 是刚出死区时的速度，太低会"看着不动"，太高会过冲。
  speed_min: 0.12
  speed_max: 0.55

  # 偏移量达到该值即用最大速度（归一化，0.5 = 画面边缘）
  speed_full_offset: 0.35

  # ========================================
  # 方向
  # ========================================
  # ONVIF 各厂商方向定义不完全一致，接错会变成"追着目标跑到反方向"。
  # 目标偏右 → 云台应向右转（pan 正）；目标偏下 → 云台应向下看（tilt 负）。
  # 若实测方向相反，把对应值改成 -1。
  pan_sign: 1
  tilt_sign: -1

  # ========================================
  # 目标有效性
  # ========================================
  # 只锁定这些类别（留空 = 画面里第一个合格目标就锁）。
  # 一台相机同时有行人和车辆时，填写 ["人", "person"] 可确保只追人。
  # 标签文案必须与检测模型的 labels 文件一致，否则永远锁不上。
  lock_labels: []

  # 目标连续可见多少帧才允许动手（避免一闪而过的误检把云台带偏）
  min_frames: 3

  # 目标多久没更新就判定跟丢并停转（秒，wall clock）
  # 云台转动时目标会短暂模糊丢帧，给太短会频繁起停
  lost_timeout: 1.5

  # 目标框最小归一化高度，低于此值不跟踪（太小了，转过去也看不清）
  min_target_height: 0.02

  # ========================================
  # 安全
  # ========================================
  # 单次连续转动的最长时间（秒），到点强制停转并冷却，
  # 防止目标位置异常（比如被误检钉在画面边缘）导致云台一直转
  max_continuous_move: 20.0

  # 超时强制停转后的冷却时间（秒），期间不再响应
  cooldown_after_max: 5.0

  # 控制器连接失败后的重试间隔（秒）
  controller_retry_interval: 60.0
