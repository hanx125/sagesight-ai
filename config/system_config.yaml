logging:
  level: INFO
  file: logs/system.log
  console: true
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  max_size: 10
  backup_count: 5
monitoring:
  enabled: true
  stats_interval: 5
  gpu_monitoring: true
  cpu_monitoring: true
  memory_monitoring: true
  data_path: logs/monitoring
database:
  type: sqlite
  path: data/sagesight.db
  pool_enabled: false
  pool_size: 5
web_server:
  port: 5555
  debug: false
  cors_enabled: true
  static_dir: static
  template_dir: templates
media_server:
  api_url: http://127.0.0.1:80
  secret: 035c73f7-bb6b-4889-c7af-364410af2b54
  auto_start_stream: true
  stream_timeout: 10
task_manager:
  max_concurrent_tasks: 5
  status_check_interval: 2
  restart_delay: 5
  enable_monitor_thread: true

# ========================================
# 硬件加速配置
# ========================================
hardware:
  # CUDA 配置
  cuda:
    enabled: true  # 是否启用CUDA
    device_id: 0   # GPU设备ID
    version: "12.6"  # CUDA版本（用于兼容性检查）
    
  # TensorRT 配置
  tensorrt:
    enabled: true  # 是否启用TensorRT
    version: "10.5.0.18"  # TensorRT版本
    # TensorRT lib目录路径（Windows需要配置）
    # 支持多种配置方式：
    # 1. 直接指定路径
    # 2. 使用环境变量 TENSORRT_LIB_PATH
    # 3. 自动检测（如果已添加到系统PATH）
    lib_path: ""  # 空值表示自动检测或使用环境变量
    # lib_path示例：
    #   - "D:\\TensorRT-10.5.0.18.Windows.win10.cuda-12.6\\TensorRT-10.5.0.18\\lib"
    #   - "C:\\Program Files\\TensorRT\\lib"
    #   - "/usr/local/TensorRT/lib" (Linux)
    
    # Engine缓存目录
    engine_cache_path: "./trt_cache"
    
    # FP16精度（性能提升约2.5x）
    use_fp16: true
    
    # 显存限制（字节）
    gpu_mem_limit: 6442450944  # 6GB

storage:
  minio:
    enabled: true
    endpoint: 192.168.5.40:9000
    access_key: minioadmin
    secret_key: minioadmin
    secure: false
    presigned_expires: 3600
  ftp:
    enabled: true
    host: 192.168.5.2
    port: 21
    username: admin
    password: admin123
    passive_mode: true
mqtt:
  enabled: false
  config:
    broker: mqtt://localhost:1883
    topic: sagesight/events
    qos: 1
    retain: false
websocket:
  enabled: false
  config:
    host: 0.0.0.0
    port: 8765
