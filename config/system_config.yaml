logging:
  level: INFO
  file: logs/system.log
  console: true
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  max_size: 10
  backup_count: 5
monitoring:
  enabled: true
  stats_interval: 5
  gpu_monitoring: true
  cpu_monitoring: true
  memory_monitoring: true
  data_path: logs/monitoring
database:
  type: sqlite
  path: data/sagesight.db
  pool_enabled: false
  pool_size: 5
web_server:
  port: 5555
  debug: false
  cors_enabled: true
  static_dir: static
  template_dir: templates
media_server:
  api_url: http://127.0.0.1:80
  secret: 035c73f7-bb6b-4889-c7af-364410af2b54
  auto_start_stream: true
  stream_timeout: 10
task_manager:
  max_concurrent_tasks: 5
  status_check_interval: 2
  restart_delay: 5
  enable_monitor_thread: true
hardware:
  cuda:
    enabled: true
    device_id: 0
    version: '12.6'
  tensorrt:
    enabled: true
    version: 10.5.0.18
    lib_path: ''
    engine_cache_path: ./trt_cache
    use_fp16: true
    gpu_mem_limit: 6442450944
storage:
  minio:
    enabled: false  # 禁用 MinIO（避免连接超时阻塞启动）
    endpoint: 192.168.5.40:9000
    access_key: minioadmin
    secret_key: minioadmin
    secure: false
    presigned_expires: 3600
  ftp:
    enabled: false
    host: 192.168.5.2
    port: 21
    username: admin
    password: admin123
    passive_mode: true
mqtt:
  enabled: false
  config:
    broker: mqtt://localhost:1883
    topic: sagesight/events
    qos: 1
    retain: false
websocket:
  enabled: false
  config:
    host: 0.0.0.0
    port: 8765
video_file_upload:
  max_file_size_mb: 100
  allowed_formats:
  - mp4
  - avi
  - mkv
  - mov
  - wmv
  - flv
  upload_dir: uploads/video_files
  max_batch_count: 20
