logging:
  level: INFO
  file: logs/system.log
  console: true
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  max_size: 10
  backup_count: 5
monitoring:
  enabled: true
  stats_interval: 5
  gpu_monitoring: true
  cpu_monitoring: true
  memory_monitoring: true
  data_path: logs/monitoring
database:
  type: sqlite
  path: data/tasks.db
  pool_enabled: false
  pool_size: 5
web_server:
  host: 192.168.5.3
  port: 5556
  debug: false
  cors_enabled: true
  static_dir: static
  template_dir: templates
  socketio:
    enabled: true
    namespace: /ws
    cors_allowed_origins: '*'
  raw_websocket:
    enabled: true
    path: /ws/raw
    message_format: '{"event": "<事件名>", "data": {<事件数据>}}'
storage:
  minio:
    enabled: true
    endpoint: 192.168.5.40:9000
    access_key: minioadmin
    secret_key: minioadmin
    secure: false
    presigned_expires: 3600
  ftp:
    enabled: true
    host: 192.168.5.3
    port: 21
    username: admin
    password: admin123
    passive_mode: true
mqtt:
  enabled: true
  config:
    broker: mqtt://192.168.5.40:1883
    topic: sagesight/events
    qos: 1
    retain: false
video_file_upload:
  max_file_size_mb: 100
  allowed_formats:
  - mp4
  - avi
  - mkv
  - mov
  - wmv
  - flv
  upload_dir: uploads/video_files
  max_batch_count: 20
events_cleanup:
  enabled: true
  retention_days: 7
  cleanup_interval_hours: 24
  startup_delay_seconds: 120
  batch_size: 200
event_dedup:
  enabled: true
  window_seconds: 300
  iou_threshold: 0.85
node_management:
  enabled: false
  node_id: ''
  agent_token: ''
  control_plane_url: http://127.0.0.1:5000/admin-api/node/agent
  heartbeat_interval: 10
  agent_listen_host: 0.0.0.0
  agent_listen_port: 9100
  agent_version: 1.0.0
  ai_root: /opt/AI
  video_root: /opt/VIDEO
  media_cluster_root: /opt/media-cluster
voice:
  # 报警语音的输出设备（服务端播放，留空表示使用系统默认设备）
  # 多声卡设备上必须指定，否则会落到没有播放能力的声卡（如 HDMI 输入）上。
  # 用 aplay -l 查看可用声卡，例如 ES8388 模拟输出为 plughw:1,0
  audio_device: ''
  # SDL 音频驱动：alsa / pulseaudio（留空由 SDL 自动选择）
  audio_driver: ''
  # 每轮播放前执行的 shell 命令（用于打开功放使能开关，留空则不执行）
  # 例：amixer -c 1 sset "hp switch" on; amixer -c 1 sset "spk switch" on
  pre_play_command: ''
