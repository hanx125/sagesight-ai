logging:
  level: INFO
  file: logs/system.log
  console: true
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  max_size: 10
  backup_count: 5
monitoring:
  enabled: true
  stats_interval: 5
  gpu_monitoring: true
  cpu_monitoring: true
  memory_monitoring: true
  data_path: logs/monitoring
database:
  type: sqlite
  path: data/tasks.db
  pool_enabled: false
  pool_size: 5
web_server:
  port: 5556
  debug: false
  cors_enabled: true
  static_dir: static
  template_dir: templates
  # 实时通信（双通道）：
  # 1. Socket.IO（复用 web_server 端口，namespace: /ws）— 供本项目前端使用
  # 2. 原生 WebSocket（/ws/raw 路径）— 供第三方系统标准 WebSocket 接入
  # 推送事件：ai_stream_frame（AI视频帧）、new_event（新事件）、event_update（事件更新）、gif_ready（GIF就绪）
  socketio:
    enabled: true
    namespace: /ws
    cors_allowed_origins: '*'
  raw_websocket:
    enabled: true
    path: /ws/raw
    message_format: '{"event": "<事件名>", "data": {<事件数据>}}'
storage:
  minio:
    enabled: true
    endpoint: 192.168.5.40:9000
    access_key: minioadmin
    secret_key: minioadmin
    secure: false
    presigned_expires: 3600
  ftp:
    enabled: true
    host: 192.168.5.2
    port: 21
    username: admin
    password: admin123
    passive_mode: true
mqtt:
  enabled: true
  config:
    broker: mqtt://192.168.5.40:1883
    topic: sagesight/events
    qos: 1
    retain: false
video_file_upload:
  max_file_size_mb: 100
  allowed_formats:
  - mp4
  - avi
  - mkv
  - mov
  - wmv
  - flv
  upload_dir: uploads/video_files
  max_batch_count: 20

# ========================================
# 事件清理配置（自动清理过期事件及其存储文件）
# ========================================
# 清理范围：数据库事件记录 + 对应的存储文件
#   - 本地：output/images/*.jpg、output/gifs/*.gif
#   - MinIO：图片/GIF 对象
#   - FTP：远程图片/GIF 文件
# 触发方式：
#   1. 自动：后台线程按 cleanup_interval_hours 定期执行（受 enabled 开关管控）
#   2. 手动：POST /api/events/clear?days=N（API 调用，不受 enabled 影响）
events_cleanup:
  # 是否启用自动清理（独立开关）
  # - true: 启动后台线程按间隔自动清理
  # - false: 不启动后台线程（仍可通过 API 手动清理）
  enabled: true

  # 事件保留天数
  # 说明：超过此天数的事件（含存储文件）将被清理
  retention_days: 7

  # 自动清理间隔（小时）
  # 说明：后台线程每间隔此小时数执行一次清理
  cleanup_interval_hours: 24
