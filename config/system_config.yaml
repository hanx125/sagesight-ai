logging:
  level: INFO
  file: logs/system.log
  console: true
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  max_size: 10
  backup_count: 5
monitoring:
  enabled: true
  stats_interval: 5
  gpu_monitoring: true
  cpu_monitoring: true
  memory_monitoring: true
  data_path: logs/monitoring
database:
  type: sqlite
  path: data/tasks.db
  pool_enabled: false
  pool_size: 5
web_server:
  # 服务监听地址：盒子部署时必须填盒子实际 IP（如 192.168.5.3），
  # 用于生成事件图片/GIF 的可访问 URL。留空或 0.0.0.0 会导致 URL 用 localhost，
  # 远程浏览器访问时 ERR_CONNECTION_REFUSED。
  host: 192.168.5.3
  port: 5556
  debug: false
  cors_enabled: true
  static_dir: static
  template_dir: templates
  socketio:
    enabled: true
    namespace: /ws
    cors_allowed_origins: '*'
  raw_websocket:
    enabled: true
    path: /ws/raw
    message_format: '{"event": "<事件名>", "data": {<事件数据>}}'
storage:
  minio:
    enabled: true
    endpoint: 192.168.5.40:9000
    access_key: minioadmin
    secret_key: minioadmin
    secure: false
    presigned_expires: 3600
  ftp:
    enabled: true
    host: 192.168.5.3
    port: 21
    username: admin
    password: admin123
    passive_mode: true
mqtt:
  enabled: true
  config:
    broker: mqtt://192.168.5.40:1883
    topic: sagesight/events
    qos: 1
    retain: false
video_file_upload:
  max_file_size_mb: 100
  allowed_formats:
  - mp4
  - avi
  - mkv
  - mov
  - wmv
  - flv
  upload_dir: uploads/video_files
  max_batch_count: 20
events_cleanup:
  enabled: true
  retention_days: 7
  cleanup_interval_hours: 24
# 节点管理：启动 AI 平台时同步启动节点管理客户端，向边缘平台注册节点、
# 上报心跳与系统指标，并接收控制面下发的部署/停止指令。
# 上报字段名（nodeId/agentToken/cpuPercent/...）与边缘平台约定保持一致。
node_management:
  # 总开关：false 时不启动节点管理服务
  enabled: false
  # 节点 ID（在前端节点详情中获取，字符串类型如 node-ad03966e）
  node_id: ''
  # Agent 令牌（在前端节点详情的 Agent 部署 Tab 中获取）
  agent_token: ''
  # 控制面地址（边缘平台后端地址）
  control_plane_url: http://127.0.0.1:5000/admin-api/node/agent
  # 心跳间隔（秒）
  heartbeat_interval: 10
  # Agent HTTP 服务监听（接收部署/停止指令，需与边缘平台约定一致）
  agent_listen_host: 0.0.0.0
  agent_listen_port: 9100
  # Agent 版本号（注册时上报）
  agent_version: 1.0.0
  # AI 代码根目录（远程部署模型服务时使用）
  ai_root: /opt/AI
  # VIDEO 代码根目录（远程部署算法任务时使用）
  video_root: /opt/VIDEO
  # 媒体集群脚本目录（远程部署 SRS/ZLM 时使用）
  media_cluster_root: /opt/media-cluster
