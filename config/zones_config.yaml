# ========================================
# Zone 区域配置文件
# ========================================
# ⚠️ 重要说明：Zone配置是通道级配置，不应该在任务配置中显示
#
# 架构说明：
# - Zone配置保存在通道表（channels表）中
# - 任务表不需要保存Zone配置
# - 一个通道可以被多个任务使用，Zone配置在通道级别共享
#
# 优势：
# - 减少误报（只关注特定区域）
# - 入侵检测（区域进入/离开）
# - 提高事件质量（必需区域过滤）
#
# 使用场景：
# - 固定摄像头（区域固定）
# - 入侵检测（禁区监控）
# - 车辆计数（车道检测）

# ========================================
# 区域定义（示例）
# ========================================

zones:
  # 示例1：入口区域（必需区域）
  - name: "entrance"
    # 多边形顶点（顺时针或逆时针）
    # 格式：[[x1, y1], [x2, y2], [x3, y3], ...]
    # 说明：至少需要3个顶点
    polygon: [[100, 100], [200, 100], [200, 200], [100, 200]]

    # 是否为必需区域
    # 说明：如果设置为 true，则对象必须至少进入一个必需区域才会触发事件
    # 用于过滤误报，提高事件质量
    required: true

    # 可视化颜色（RGB 格式：[R, G, B]）
    # 说明：用于在视频上绘制区域，便于调试
    color: [0, 255, 0]  # 绿色

    # 最小区域面积（过滤小区域，像素）
    # 说明：面积小于此值的区域会被忽略
    # 推荐值：0（不过滤）
    min_area: 0

  # 示例2：停车区域（非必需区域）
  - name: "parking"
    polygon: [[300, 100], [400, 100], [400, 200], [300, 200]]
    required: false
    color: [255, 0, 0]  # 蓝色
    min_area: 0

  # 示例3：禁区（必需区域）
  - name: "forbidden_zone"
    polygon: [[500, 100], [600, 100], [600, 200], [500, 200]]
    required: true
    color: [0, 0, 255]  # 红色（表示禁区）
    min_area: 0

  # 示例4：走廊区域（多边形）
  - name: "corridor"
    polygon: [[100, 300], [150, 300], [150, 400], [100, 400]]
    required: false
    color: [255, 255, 0]  # 青色
    min_area: 0

# ========================================
# Zone 检测配置
# ========================================

zone_detection:
  # 是否启用 Zone 检测
  # 说明：启用后，只有进入Zone区域的目标才会触发事件
  enabled: true

  # 是否发送区域进入事件
  # 说明：当目标进入Zone区域时，发送事件
  send_enter_events: true

  # 是否发送区域离开事件
  # 说明：当目标离开Zone区域时，发送事件
  send_leave_events: true

  # 是否启用必需区域过滤
  # 说明：如果启用，则对象必须至少进入一个必需区域才会触发事件
  # 参考：Frigate 的 required_zones 逻辑
  required_zone_filter: true

  # 可视化配置
  visualization:
    # 是否在视频上绘制区域
    enabled: true

    # 区域透明度（0-1）
    # 说明：值越大越不透明
    alpha: 0.3

    # 是否显示区域名称
    show_name: true

    # 是否显示区域边框
    show_border: true

# ========================================
# 使用说明
# ========================================

# 1. 如何定义多边形区域：
#    - 使用顶点坐标定义多边形（顺时针或逆时针）
#    - 至少需要 3 个顶点
#    - 推荐使用顺时针顺序
#
# 2. 如何设置必需区域：
#    - 将 required 设置为 true
#    - 对象必须至少进入一个必需区域才会触发事件
#    - 用于减少误报，提高事件质量
#
# 3. 如何选择颜色：
#    - 使用 RGB 格式（[R, G, B]）
#    - 例如：[0, 255, 0] 表示绿色
#    - 推荐使用明显颜色，便于区分
#
# 4. 如何调整区域：
#    - 运行程序时启用可视化（visualization.enabled: true）
#    - 观察视频上的区域位置
#    - 根据实际场景调整顶点坐标
#
# 5. 注意事项：
#    - 区域坐标需要在视频分辨率范围内
#    - 如果视频分辨率变化，需要重新定义区域
#    - 推荐在固定摄像头场景使用

