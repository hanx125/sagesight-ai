# ========================================
# 跨相机特征提取配置
# ========================================
# 职责划分：本平台只做单机位跟踪 + 每条终态轨迹提一次外观描述子并随事件上报；
#           跨相机的身份聚合与轨迹串联由边缘平台完成，本机不再建立跨相机身份。
#
# 该文件由「系统配置 → 特征提取」页面写入（整体重写，手写注释不保留）。
# 页面只维护 feature.*；下方的 enabled / 时间窗 / 阈值 / 分组 / weights 等
# 融合相关键是早期本机融合的遗留配置，已无消费方，保留仅为兼容读取。
#
cross_camera:
  # 总开关（关闭后融合服务不启动，事件表不再计算外观特征）
  # 边缘平台负责跨几十上百路相机的身份聚合，AI 平台只产单镜轨迹：
  # 此处关闭融合，避免两边都建身份、同一目标出现两个ID。
  # 终态事件仍会在推送时提取外观描述子（_terminal_embedding），不受此开关影响。
  enabled: false

  # 轮询间隔（秒）：越小越实时，越大越省 CPU
  poll_interval: 1.0

  # 单次轮询最多处理的事件数（防止重启后积压）
  batch_size: 100

  # 默认通行时间窗（秒）：目标从相机A消失到相机B出现的最长间隔
  max_gap_seconds: 120

  # 允许的时间重叠（秒）：两台相机同时看到同一目标（重叠覆盖区）时取正值上限
  max_overlap_seconds: 60

  # 身份活跃窗口（分钟）：超过该时间未再出现，身份标记为 closed 不再参与关联
  identity_ttl_minutes: 30

  # 单个身份最多关联的相机数
  max_cameras_per_identity: 32

  # ========================================
  # 相机区域分组
  # ========================================
  # 规则：只有同一组内的相机之间才允许关联（跨组不关联）。
  # cameras 填相机 ID（cameras 表的 id，也就是事件里的 camera_id）。
  # 留空列表 = 所有相机视为同一组（全组互通，零配置可用）。
  #
  # 示例：
  # groups:
  #   - name: 一层
  #     cameras: ["9674475c-f00b-44ed-ae3b-6d7e23e2e368", "179cf16b-f391-4183-..."]
  #     max_gap_seconds: 90     # 可选：该组覆盖默认时间窗
  #   - name: 二层
  #     cameras: ["7fc47a4e-4db3-440b-..."]
  groups: []

  # ========================================
  # 类别族（决定用哪套阈值）
  # ========================================
  # 现场标签可能是中文（人/汽车）也可能是英文（person/car），两类都收录。
  # 未命中任何族的目标按 other 处理（阈值更严，避免误关联）。
  class_families:
    person:
      - 人
      - 人员
      - 行人
      - 工人
      - 人体
      - person
      - pedestrian
      - people
    vehicle:
      - 汽车
      - 车
      - 轿车
      - 卡车
      - 货车
      - 客车
      - 公交车
      - 摩托车
      - 自行车
      - 三轮车
      - car
      - truck
      - bus
      - vehicle
      - motorbike
      - motorcycle
      - bicycle

  # ========================================
  # 各族的判定阈值
  # ========================================
  # min_score   : 综合得分下限（外观=直方图时），低于此值不关联
  # min_score_reid: 综合得分下限（外观=ReID 时）。余弦分布和直方图交集不同，
  #                 必须分开调：同一目标跨相机余弦常见 0.55~0.80，
  #                 不同目标约 0.0~0.40，所以门槛放在 0.58 附近。
  # min_score_temporal_only: 快照缺失、只能靠时间判断时的下限（应明显更低）
  # min_margin  : 最高分需领先第二名多少（避免两个候选差不多时硬凑）
  # use_appearance: 是否使用外观特征（关闭则退化为纯时空关联）
  # max_gap_seconds: 该族覆盖默认通行时间窗
  # same_camera_min_appearance: 同相机重入的外观门槛，0 = 按后端给默认
  #                             （直方图 0.72 / ReID 0.80）
  thresholds:
    person:
      min_score: 0.62
      min_score_reid: 0.58
      min_score_temporal_only: 0.35
      min_margin: 0.08
      use_appearance: true
      max_gap_seconds: 120
    vehicle:
      min_score: 0.66
      min_score_reid: 0.62
      min_score_temporal_only: 0.40
      min_margin: 0.08
      use_appearance: true
      max_gap_seconds: 180
    other:
      min_score: 0.74
      min_score_reid: 0.70
      min_score_temporal_only: 0.50
      min_margin: 0.10
      use_appearance: true
      max_gap_seconds: 60

  # ========================================
  # 打分权重（三者相加建议为 1.0）
  # ========================================
  weights:
    appearance: 0.55   # 外观相似度（ReID 余弦 / 直方图交集，按后端）
    shape: 0.15        # 形状先验（宽高比 + 相对身高）
    temporal: 0.30     # 时间接近度

  # 是否使用边缘库的强 ID（人脸姓名 / 车牌号）做硬关联
  use_strong_id: true

  # 是否允许"同一相机"上的两段轨迹互相关联
  # 默认关闭：实测同一机位 37 秒内的两辆不同车辆，外观相似度能到 0.94，
  # 开启后会把它们串成一条身份，轨迹越滚越大、跨机统计失真。
  # 只有确实需要"同机位目标重入"场景时才打开。
  link_same_camera: false

  # ========================================
  # 外观特征
  # ========================================
  # backend 决定"用什么描述目标外观"，两个选项：
  #   reid      ONNX ReID 模型（默认）。能区分"同色不同人"，单次 20~80ms。
  #             需要模型文件 models/reid/reid_resnet18.onnx，
  #             以及中心化均值 models/reid/reid_resnet18.mu.npz（tools/calibrate_reid.py 生成）。
  #             缺任何一个都会自动退回 histogram，不会报错中断。
  #   histogram HSV 三区域颜色直方图。1~3ms，零依赖，对同色不同目标无力。
  #
  # extract_in 决定"在哪个进程提取"：
  #   fusion    融合线程（默认）。整个进程只有一个模型实例，16 路相机也只占一份内存；
  #             支持对历史事件补算/重算特征。
  #   worker    相机进程。图在内存里不用读盘，但每个相机进程都会加载一份模型，
  #             盒子 4GB 内存下 16 路会直接 OOM，只在单机位部署时考虑。
  feature:
    backend: reid
    extract_in: fusion
    model_path: models/reid/reid_resnet18.onnx
    # 模型输入尺寸（模型自带固定尺寸时以模型为准）
    input_width: 128
    input_height: 256
    # onnxruntime CPU 线程数。盒子 8 核且要留给解码/检测，别给太大
    num_threads: 2
    # 目标裁剪后短边小于该像素就跳过：这么小的目标提不出可靠特征，
    # 硬算只会给匹配器喂噪声
    min_crop_px: 32
    # 模糊度下限（拉普拉斯方差），0 = 不检查
    min_sharpness: 0.0
