# ========================================
# 显示配置文件
# ========================================
# 用于控制检测结果的实时显示和 AI 视频流推送

# ========================================
# 显示窗口配置（cv2.imshow）
# ========================================
display:
  # 是否启用实时显示窗口（调试模式）
  # 推荐值：false（生产环境），true（调试）
  # 注意：多进程环境下每个 CameraWorker 都会弹出一个窗口
  enabled: false

  # 窗口标题
  window_title: "SageSight AI - Detection Monitor"

  # 目标 FPS（显示帧率限制）
  # 推荐值：15-30（调试），0（不限制）
  target_fps: 25

  # 是否启用 AI 视频流（通过 WebSocket 推送画框后的帧到前端）
  ai_stream_enabled: true

  # AI 视频流帧间隔（每 N 帧发送一次，降低带宽）
  ai_stream_interval: 1

  # 显示开关
  show_detection_boxes: true      # 是否显示检测框
  show_track_boxes: true          # 是否显示跟踪框
  show_trajectories: true         # 是否显示轨迹
  show_motion_regions: true       # 是否显示运动检测区域

  # 轨迹历史长度（显示多少帧的轨迹）
  trajectory_history_length: 30

# ========================================
# 检测框绘制配置
# ========================================
detection_box:
  # 边界框颜色（BGR格式）
  color: [0, 255, 0]  # 绿色

  # 边界框线宽
  thickness: 2

  # 标签字体大小
  font_scale: 0.5

  # 标签颜色（BGR格式）
  label_color: [0, 255, 0]  # 绿色

# ========================================
# 跟踪框绘制配置
# ========================================
track_box:
  # 边界框颜色（BGR格式）
  color: [255, 0, 0]  # 蓝色

  # 边界框线宽
  thickness: 2

  # ID标签字体大小
  font_scale: 0.5

  # ID标签颜色（BGR格式）
  label_color: [255, 0, 0]  # 蓝色

# ========================================
# 轨迹绘制配置
# ========================================
trajectory:
  # 轨迹线颜色（BGR格式）
  color: [0, 255, 255]  # 黄色

  # 轨迹线宽度
  thickness: 1

  # 轨迹点大小
  point_size: 2

  # 轨迹点颜色（BGR格式）
  point_color: [0, 0, 255]  # 红色

# ========================================
# 运动检测区域绘制配置（预留）
# ========================================
motion_region:
  # 区域边界颜色（BGR格式）
  color: [255, 255, 0]  # 青色

  # 区域边界线宽
  thickness: 1

  # 区域填充颜色（BGR格式，半透明）
  fill_color: [255, 255, 0]  # 青色

  # 填充透明度（0-255）
  fill_alpha: 50

# ========================================
# 调试信息显示配置
# ========================================
debug_info:
  # 是否显示FPS
  show_fps: true

  # 是否显示检测数量
  show_detection_count: true

  # 是否显示跟踪数量
  show_track_count: true

  # 是否显示帧ID
  show_frame_id: true

  # FPS显示位置（左上角）
  fps_position: [10, 30]

  # 信息字体大小
  font_scale: 0.6

  # 信息颜色（BGR格式）
  text_color: [255, 255, 255]  # 白色

# ========================================
# 说明
# ========================================
# 1. 生产环境建议关闭显示窗口（enabled: false），避免 GUI 开销
# 2. 调试时可以启用显示窗口（enabled: true），实时查看检测结果
# 3. AI 视频流通过 WebSocket 推送到前端，推荐使用此方式替代 cv2.imshow
# 4. 所有颜色均为 BGR 格式（OpenCV 标准）
