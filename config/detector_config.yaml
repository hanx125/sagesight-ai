# ========================================
# YOLO 目标检测配置文件
# ========================================
# 硬件配置：NVIDIA RTX 2070 (8GB) | CUDA 12.9 | Python 3.11 | 32GB RAM
# 
# 适用场景：
# - 室内外场景（光照变化）
# - 固定摄像头（背景稳定）
# - 移动摄像头（背景变化）
# 
# 优势：
# - 高精度目标检测
# - 支持多种目标类别
# - GPU 加速推理

# ========================================
# 检测器配置
# ========================================

detector:
  # ========================================
  # 模型配置（从算法库获取）
  # ========================================
  # 说明：模型路径、类型、输入尺寸、类别名称等参数由算法库提供
  # 此处仅作为示例，实际运行时会从算法库动态获取
  
  # 模型路径（示例，从算法库获取）
  # model_path: "models/yolov11n.onnx"
  
  # 模型类型（示例，从算法库获取）
  # model_type: "yolo11n"
  
  # 模型输入尺寸（示例，从算法库获取）
  # input_width: 640
  # input_height: 640
  
  # 类别名称（示例，从算法库获取）
  # class_names: ["person", "bicycle", "car", ...]
  
  # ========================================
  # 推理后端配置（用户配置）
  # ========================================
  
  # 推理后端（必填，用户选择）
  # 可选值：
  # - onnx_cpu: ONNX Runtime CPU（纯CPU推理，无需GPU，适合无GPU环境）
  # - onnx_cuda: ONNX Runtime + CUDA Execution Provider（CUDA加速，适合NVIDIA GPU）
  # - onnx_tensorrt: ONNX Runtime + TensorRT Execution Provider（TensorRT EP，推荐，FP16加速）
  # - tensorrt: 直接加载 TensorRT Engine（需要 cuda-python，高性能）
  # - rknn: RKNN模型（RK3588/RK3566等瑞芯微平台NPU加速）
  backend: "onnx_cuda"
  
  # TensorRT Engine 缓存路径（首次运行会自动编译）
  # 说明：使用 backend="onnx_tensorrt" 时，ONNX 模型会自动编译为 TensorRT Engine 并缓存
  tensorrt_engine_cache_path: "./trt_cache"
  
  # 使用 FP16 精度（推荐，性能提升约 2.5x）
  # 说明：FP16 可以显著提升推理速度，精度损失极小
  use_fp16: true
  
  # TensorRT Engine 文件路径（backend="tensorrt" 时使用）
  # 说明：如果使用 backend="onnx_tensorrt"，则不需要此配置（会自动生成）
  tensorrt_engine_path: ""
  
  # TensorRT lib 目录路径（Windows 需要配置）
  # 说明：如果已配置系统环境变量，则不需要此配置
  # 支持空值，会自动检测常见路径
  tensorrt_lib_path: ""

  # RKNN 配置（仅 backend="rknn" 时使用）
  # 目标平台：rk3588 | rk3566 | rk3568 | rv1103 | rv1106
  rknn_target: "rk3588"

  # RKNN 设备 ID（多设备时使用）
  rknn_device_id: ""

  # RKNN 核心掩码（0=自动，1=NPU0，2=NPU1，3=双核）
  rknn_core_mask: 0
  
  # 全局置信度阈值（用户配置）
  # 推荐值：0.25（默认），0.15（更宽松），0.35（更严格）
  conf_threshold: 0.25
  
  # NMS IoU 阈值（用户配置）
  # 推荐值：0.35（默认），0.25（去除更多重叠），0.45（保留更多）
  iou_threshold: 0.35
  
  # 最小检测框面积（像素）
  # 说明：过滤过小的检测框，减少噪声和误检
  # 推荐值：10-500（小目标用小值，大目标用大值）
  min_box_area: 50
  
  # ========================================
  # 以下参数已从算法库获取（仅作为示例）
  # ========================================
  
  # 模型输入尺寸（示例，从算法库获取）
  # 说明：YOLO 模型期望的输入分辨率，通常为 640
  # input_width: 640
  # input_height: 640
  
  # ========================================
  # GPU 配置（用户配置）
  # ========================================
  
  # GPU 设备 ID（多GPU环境时选择）
  device_id: 0
  
  # GPU 显存限制（字节）
  # 说明：限制显存使用，避免显存溢出
  # 推荐值：GPU 显存的 60-80%（例如 RTX 2070 8GB -> 6GB = 6442450944）
  gpu_mem_limit: 6442450944

# ========================================
# 预处理配置
# ========================================

preprocessor:
  # 输入尺寸（解码器输出尺寸）
  width: 640
  height: 640
  
  # YOLO 模型输入尺寸（模型期望的输入分辨率）
  # 说明：如果 width/height 与 model_input_size 不同，会在预处理时自动 resize
  model_input_size: 640
  
  # 归一化配置
  # 说明：YOLO 模型通常使用简单的 [0, 1] 归一化，不需要均值和标准差
  # 如果需要自定义归一化，可以设置以下参数（代码会自动使用）
  rgb_mean: [0.0, 0.0, 0.0]
  rgb_std: [1.0, 1.0, 1.0]

# ========================================
# 检测进程池配置（高级功能）
# ========================================

detection_pool:
  # 是否启用检测进程池（默认：false）
  # 说明：
  #   - false: 传统单线程模式（稳定，适合低配机器）
  #   - true: 多进程模式（高并发，适合多核CPU）
  # 推荐值：
  #   - 单摄像机/低性能设备: false
  #   - 多摄像机/高性能服务器: true
  use_detection_pool: false