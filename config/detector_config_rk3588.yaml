# ========================================
# YOLO 目标检测配置文件 (RK3588 专用)
# ========================================
# 硬件配置：RK3588 | 双核NPU (6 TOPS) | ARM Cortex-A76/A55 | 8GB RAM
#
# 适用场景：
# - 边缘AI推理（NPU加速）
# - 低功耗、高性能
# - 多路视频流处理
#
# 优势：
# - NPU推理比CPU快10-20倍
# - 支持INT8量化（性能最佳）
# - 双核NPU并行处理
# - 低功耗（5-10W）

# ========================================
# 检测器配置
# ========================================

detector:
  # ========================================
  # 推理后端配置（RK3588 NPU）
  # ========================================

  # 推理后端：使用 RKNN (NPU加速)
  backend: "rknn"

  # RKNN 配置
  # 目标平台：rk3588
  rknn_target: "rk3588"

  # RKNN 设备 ID（多设备时使用，默认为空）
  rknn_device_id: ""

  # RKNN 核心掩码（NPU核心选择）
  # 0 = 自动（推荐，系统自动分配）
  # 1 = NPU0
  # 2 = NPU1
  # 3 = 双核并行
  rknn_core_mask: 0

  # ========================================
  # 模型配置（需要转换为RKNN格式）
  # ========================================

  # RKNN 模型路径（需要将ONNX转换为RKNN）
  # model_path: "models/yolov11n.rknn"

  # ========================================
  # 预处理配置
  # ========================================

  # GPU预处理（RK3588无CUDA，必须设为false）
  use_gpu_preprocess: false

  # ========================================
  # 推理参数
  # ========================================

  # 全局置信度阈值
  # 推荐值：0.25（默认），0.20（RK3588 INT8量化可能需要降低）
  conf_threshold: 0.25

  # NMS IoU 阈值
  iou_threshold: 0.35

  # 最小检测框面积（像素）
  min_box_area: 50

  # ========================================
  # 性能优化建议
  # ========================================
  # 1. 模型转换：
  #    - 在PC上使用 rknn-toolkit2-lite 转换 ONNX → RKNN
  #    - 启用 INT8 量化（性能最佳）
  #    - 输入尺寸建议：320x320 或 416x416（平衡性能和精度）
  #
  # 2. 多核NPU：
  #    - RK3588有双核NPU，可以并行处理2个模型
  #    - 设置 rknn_core_mask=3 启用双核（需确保模型支持）
  #
  # 3. 内存优化：
  #    - 使用 DRM Prime 格式避免内存复制
  #    - 模型输入尺寸越小，内存占用越低
  #
  # 4. 性能监控：
  #    - 使用 'cat /sys/kernel/debug/rknpu/load' 监控NPU使用率
  #    - 使用 'top' 监控CPU占用

# ========================================
# 预处理配置
# ========================================

preprocessor:
  # 输入尺寸（解码器输出尺寸）
  # 建议：640x640 或更小（320x320）
  width: 640
  height: 640

  # YOLO 模型输入尺寸
  # 建议：与width/height保持一致，避免resize
  model_input_size: 640

  # 归一化配置
  rgb_mean: [0.0, 0.0, 0.0]
  rgb_std: [1.0, 1.0, 1.0]

# ========================================
# 检测进程池配置
# ========================================

detection_pool:
  # 启用检测进程池（推荐，充分利用多核CPU）
  use_detection_pool: true

  # 检测器进程数量（建议：2-3，因为RK3588双核NPU）
  # 如果使用单核NPU或模型较大，建议设为1
  num_detectors: 2

  # 全局检测队列容量
  detection_queue_size: 1000

  # 结果队列容量（每个摄像机）
  result_queue_size: 100

# ========================================
# 替代方案：ONNX CPU（如果NPU不可用）
# ========================================
# detector:
#   backend: "onnx_cpu"
#   conf_threshold: 0.25
#   iou_threshold: 0.35
#   min_box_area: 50