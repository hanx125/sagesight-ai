# ========================================
# 运动检测配置文件
# ========================================
# 基于帧差法实现，CPU 占用比 MOG2 低 5 倍
#
# 优势：
# - CPU 占用低（比 MOG2 低 5 倍）
# - 快速启动（30 帧预热）
# - 适应光照变化
# - 不依赖背景建模
#
# 适用场景：
# - 固定摄像头（背景稳定）
# - 室外场景（光照变化）
# - 室内场景（人员流动）

# ========================================
# 核心参数（用户配置）
# ========================================

# 是否启用运动检测
# 说明：运动检测可以过滤静态场景，只在检测到运动时才进行目标检测
# - true: 启用运动检测（推荐，降低CPU占用）
# - false: 禁用运动检测（每帧都进行检测）
enabled: true

# 运动检测分辨率（高度，宽度自动按比例计算）
# 推荐值：120-180（性能与精度平衡）
#
# 说明：
# - 降采样分辨率，值越小性能越好，但精度降低
# - 实际分辨率为：motion_height x (motion_height * 原始宽高比)
#
# 推荐值：
#   - 180：平衡性能与精度（推荐）
#   - 120：高性能模式（精度略低，CPU 占用更低）
#   - 240：高精度模式（精度更高，CPU 占用增加）
#
# ⚠️ 性能影响：
#   - motion_height=120: CPU 占用约 2-3ms/帧
#   - motion_height=180: CPU 占用约 3-5ms/帧
#   - motion_height=240: CPU 占用约 5-8ms/帧
motion_height: 180

# 运动阈值（0-255）
# 推荐值：20-30
#
# 说明：
# - 像素差异超过此阈值即认为有运动
# - 值越小：检测更敏感，但噪声更多（误检增加）
# - 值越大：检测更稳定，但可能漏检慢速运动
#
# 推荐值：
#   - 25：默认推荐值（平衡）
#   - 20：更敏感（适合慢速运动或小目标）
#   - 30：更稳定（适合噪声较多的场景）
threshold: 25

# 最小轮廓面积（像素，过滤噪声）
# 推荐值：150-300
#
# 说明：
# - 过滤小于此面积的轮廓（降噪）
# - 面积小于此值的运动区域会被忽略
# - 值越小：检测更敏感，但噪声更多
# - 值越大：过滤更多噪声，但可能漏检小目标
#
# 推荐值：
#   - 200：推荐值（过滤大部分噪声）
#   - 150：更敏感（适合小目标，如人脸）
#   - 300：更严格（适合大目标，如车辆）
contour_area: 200

# 是否增强对比度（适应光照变化）
# 推荐值：false（性能优先），true（精度优先）
#
# 说明：
# - 开启对比度增强可以适应光照变化（如日光变化、灯光开关）
# - 但会增加计算开销（约 2-3ms/帧）
#
# 推荐值：
#   - false：生产环境推荐（性能优先，CPU 占用低）
#   - true：光照剧烈变化场景（如室外、窗户旁）
#
# ⚠️ 性能影响：
#   - improve_contrast=false: CPU 占用约 3-5ms/帧
#   - improve_contrast=true: CPU 占用约 5-8ms/帧
improve_contrast: false

# 高斯滤波半径（降噪）
# 推荐值：1-2
#
# 说明：
# - 模糊核用于降噪，减少噪声干扰
# - 值越大：降噪效果越好，但细节丢失
# - 值越小：保留更多细节，但噪声更多
#
# 推荐值：
#   - 1：推荐值（平衡性能与效果）
#   - 0：不滤波（适合噪声极少的场景）
#   - 2：强降噪（适合噪声较多的场景）
blur_radius: 1

# 背景更新速率（0-1，越大更新越快）
# 推荐值：0.01-0.2
#
# 说明：
# - 控制背景模型的更新速度（加权平均）
# - 值越大：背景更新越快，适应场景变化更快
# - 值越小：背景更新越慢，更稳定但响应慢
#
# 推荐值：
#   - 0.01：缓慢更新（适合静态背景，如室内）
#   - 0.2：快速更新（适合动态场景，如室外）
#   - 0.1：推荐值（平衡）
frame_alpha: 0.01

# 闪电检测阈值（运动占比超过此值重新校准）
# 推荐值：0.6-0.8
#
# 说明：
# - 当运动占比超过此阈值时，认为场景发生剧烈变化（如闪电、红外切换）
# - 触发重新校准背景模型（重置 avg_frame）
# - 值越小：更敏感，频繁重新校准（可能误判）
# - 值越大：更稳定，避免频繁重新校准
#
# 推荐值：
#   - 0.8：推荐值（避免频繁重新校准）
#   - 0.6：更敏感（适合光照频繁变化的场景）
#   - 0.9：更稳定（适合光照稳定的场景）
lightning_threshold: 0.8

# 对比度历史帧数（用于跟踪光照变化）
# 推荐值：30-50
#
# 说明：
# - 保留最近 N 帧的对比度历史，用于计算平均对比度
# - 值越大：历史信息越丰富，但响应变慢
# - 值越小：响应更快，但历史信息少
#
# 推荐值：
#   - 50：推荐值（历史信息丰富）
#   - 30：响应更快（适合光照快速变化的场景）
contrast_frame_history: 50

# ========================================
# 掩码配置（可选）
# ========================================
# 掩码用于忽略某些区域的运动检测
# 例如：忽略画面边缘的树木晃动、广告牌变化等
#
# 说明：
# - mask 参数不在配置文件中设置，由前端区域绘制工具生成
# - mask 为二值图像（0=忽略，255=检测）
# - 实际运行时从数据库或配置中加载

# ========================================
# 性能优化建议
# ========================================
# 1. CPU 占用优化：
#    - 降低 motion_height（如 120），CPU 占用降低约 40%
#    - 关闭 improve_contrast（设为 false），CPU 占用降低约 30%
#    - 增大 contour_area（如 300），减少轮廓处理开销
#
# 2. 检测精度优化：
#    - 降低 threshold（如 20），提高对慢速运动的检测
#    - 降低 contour_area（如 150），提高对小目标的检测
#    - 开启 improve_contrast（设为 true），适应光照变化
#
# 3. 场景适配建议：
#    - 室内静态场景：motion_height=180, threshold=25, improve_contrast=false
#    - 室外动态场景：motion_height=180, threshold=30, improve_contrast=true
#    - 高性能场景：motion_height=120, threshold=30, improve_contrast=false
#    - 高精度场景：motion_height=240, threshold=20, improve_contrast=true

# ========================================
# 典型场景配置示例
# ========================================
# 场景1：室内办公室（光照稳定）
#   motion_height: 180
#   threshold: 25
#   contour_area: 200
#   improve_contrast: false
#   frame_alpha: 0.01
#
# 场景2：室外停车场（光照变化）
#   motion_height: 180
#   threshold: 30
#   contour_area: 300
#   improve_contrast: true
#   frame_alpha: 0.2
#
# 场景3：高性能模式（低功耗设备）
#   motion_height: 120
#   threshold: 30
#   contour_area: 300
#   improve_contrast: false
#   frame_alpha: 0.01