# ========================================
# 运动检测配置文件
# ========================================
# 使用背景建模（MOG2）检测运动区域，辅助目标检测和跟踪
# 
# 优势：
# - 解决检测框断断续续问题
# - 提供额外的跟踪线索
# - 减少误检和漏检
# 
# 适用场景：
# - 固定摄像头（背景相对稳定）
# - 室外场景（光照变化）
# - 室内场景（人员流动）
# 
# 不适用场景：
# - 移动摄像头（背景不断变化）
# - 快速光照变化（如闪光灯）

# ========================================
# 核心参数
# ========================================

# 是否启用运动检测
#enabled: true

# 背景建模历史帧数（越大越稳定，但启动慢）
# 推荐值：300-500（固定摄像头），100-200（光照变化场景）
# 
# 说明：
# - 历史帧数越多，背景建模越稳定，但启动时间越长
# - 固定摄像头：推荐 500（稳定）
# - 光照变化场景：推荐 100-200（快速适应）
history: 500

# 方差阈值（越小越敏感，但噪声多）
# 推荐值：16.0（默认），10.0（更敏感），25.0（更稳定）
# 
# 说明：
# - 值越小：检测更敏感，但噪声更多
# - 值越大：检测更稳定，但可能漏检
# - 默认值 16.0 是 OpenCV MOG2 的推荐值
var_threshold: 25.0

# 是否检测阴影（建议关闭，提高速度）
# 推荐值：false（生产环境），true（调试）
# 
# 说明：
# - 开启阴影检测会增加计算开销
# - 阴影检测可能导致误检（阴影被识别为运动）
detect_shadows: false

# 最小运动区域面积（像素，过滤噪声）
# 推荐值：500-1000（过滤小噪声）
# 
# 说明：
# - 值越小：检测更敏感，但噪声更多
# - 值越大：过滤更多噪声，但可能漏检小目标
min_area: 1500

# 模糊核大小（降噪）
# 推荐值：5-7
# 
# 说明：
# - 模糊核用于降噪，减少噪声干扰
# - 值越大：降噪效果越好，但细节丢失
blur_size: 7

# 形态学核大小（填充空洞）
# 推荐值：5-7
# 
# 说明：
# - 形态学操作用于填充运动区域的空洞
# - 值越大：填充效果越好，但可能合并相邻区域
morph_size: 5

# 学习率（-1 表示自动）
# 推荐值：-1（自动），0.001-0.01（手动）
# 
# 说明：
# - 学习率控制背景模型的更新速度
# - -1：自动学习率（OpenCV 推荐）
# - 0.001-0.01：手动设置（更精确控制）
learning_rate: -1

# 运动历史保留帧数（用于辅助重识别）
# 推荐值：10-20
# 
# 说明：
# - 保留最近的运动区域历史，用于辅助轨迹重识别
# - 值越大：历史信息越丰富，但内存占用增加
motion_history_length: 10

# 初始化所需帧数（背景建模预热）
# 推荐值：30-50
# 
# 说明：
# - 背景建模器需要一定帧数才能稳定
# - 值越大：建模更稳定，但启动时间更长
init_threshold: 30

# 前景占比判定阈值（判定是否在运动区域内）
# 推荐值：0.2-0.5
# 
# 说明：
# - 检测框内前景像素占比超过此阈值，判定为在运动区域
# - 值越小：判定更宽松，但可能误判
# - 值越大：判定更严格，但可能漏判
foreground_threshold: 0.3

# 最大运动区域数量（限制过多区域）
# 推荐值：10-20（过滤过多区域）
# 
# 说明：
# - 限制运动区域数量，避免过多区域影响性能
# - 值越小：性能更好，但可能漏检
# - 值越大：检测更完整，但性能开销增加
max_motion_regions: 5

# ========================================
# 可视化配置
# ========================================

# 是否显示运动检测可视化（红色叠加）
# 推荐值：false（生产环境），true（调试）
# 
# 说明：
# - 开启可视化会增加显示开销
# - 生产环境建议关闭，调试时开启
show_visualization: false

# ========================================
# 融合策略配置
# ========================================

fusion:
  # 置信度增益（检测框在运动区域内时增加）
  # 推荐值：0.1-0.2（避免过度影响）
  # 
  # 说明：
  # - 检测框在运动区域内时，置信度增加
  # - 值越大：运动检测的影响越大
  # - 注意：不要设置太大，避免过度影响原始检测分数
  confidence_boost: 0.15
  
  # 置信度惩罚（检测框不在运动区域内时降低）
  # 推荐值：0.05-0.1（避免过度惩罚）
  # 
  # 说明：
  # - 检测框不在运动区域内时，置信度降低
  # - 值越大：惩罚越重
  # - 注意：不要设置太大，避免过度惩罚
  confidence_penalty: 0.05
  
  # 是否使用运动区域辅助重识别
  # 推荐值：true（提高跟踪稳定性）
  # 
  # 说明：
  # - 开启后，运动区域会辅助轨迹重识别
  # - 提高跟踪稳定性，减少 ID 爆炸
  use_for_reid: true