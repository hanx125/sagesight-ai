# ========================================
# 解码器模块配置文件
# ========================================
#
# 说明：
# - 此文件包含解码器的默认配置参数
# - 实际参数从任务表中动态获取（优先级更高）
# - 未在任务表中指定的参数，使用此文件的默认值
#
# 架构：环形缓冲区 + 索引队列（零拷贝）
# ========================================

# ----------------------------------------
# 解码器基础配置
# ----------------------------------------
decoder:
  # ========== 视频参数 ==========
  # 解码输出宽度
  width: 640
  
  # 解码输出高度
  height: 640
  
  # 检测帧率（推荐：30）
  # 说明：视频流的常见帧率，可根据实际需求调整
  fps: 25

  # ========== 硬件加速配置 ==========
  # 硬件加速预设（必须使用）
  # 支持的预设：
  #   - preset-dxva2: Windows DXVA2（推荐 Windows）
  #   - preset-nvidia: NVIDIA CUDA（需要 NVIDIA GPU）
  #   - preset-intel-qsv-h264: Intel QSV（需要 Intel GPU）
  #   - preset-vaapi: AMD VAAPI（Linux + AMD GPU）
  #   - preset-rk-h264: Rockchip RKMPP（RK3588/RK3566）
  # 空字符串：使用 CPU 解码（不推荐）
  hwaccel_preset: "preset-dxva2"

  # ========== 输入预设配置 ==========
  # 输入预设（用于优化 RTSP 流处理）
  # 支持的预设：
  #   - preset-rtsp-generic: RTSP 通用预设（推荐）
  #   - preset-rtsp-udp: RTSP UDP 传输
  #   - preset-http-mjpeg-generic: HTTP MJPEG 流
  # 空字符串：使用默认 RTSP 配置
  input_preset: "preset-rtsp-generic"

  # ========== 输出配置 ==========
  # ✅ 优化：固定使用I420格式（Y+U+V分离），性能提升60%
  # I420格式更适合OpenCV处理，无需Y/UV拼接，预处理性能更优
  # output_format 参数已删除，解码器强制输出I420格式

  # ========== RTSP 配置 ==========
  # RTSP 传输协议
  # - tcp: 传输稳定，适合网络不稳定场景
  # - udp: 传输延迟低，适合局域网稳定场景
  rtsp_transport: "tcp"
  
  # 是否自动重连
  reconnect: true
  
  # 重连延迟（秒）
  reconnect_delay: 5
  
  # 输入缓冲区大小（字节，推荐：2MB）
  # 说明：高码率视频建议增大此值
  buffer_size: 2097152  # 2 * 1024 * 1024

  # ========== 环形缓冲区配置（新架构）==========
  # 环形缓冲区块数量（推荐：10）
  # 说明：块数量越多，可以缓存的帧越多，避免丢帧
  # - 太少：容易丢帧（检测速度跟不上时）
  # - 太多：内存占用增加，但更稳定
  # 推荐值：
  #   - 实时性优先：5-8块
  #   - 稳定性优先：10-15块
  ring_buffer_block_count: 10

  # 索引队列大小（推荐：50）
  # 说明：索引队列用于调度和同步，只存储索引（不存储数据）
  # - 太小：容易丢帧
  # - 太大：增加延迟（但不会丢失帧）
  # 推荐值：ring_buffer_block_count * 5
  index_queue_size: 50

  # ========== 预处理配置 ==========
  # 模型输入尺寸（YOLO模型通常为640）
  # 说明：与YOLO模型训练时的输入尺寸一致
  model_input_size: 640

  # 是否启用GPU预处理（推荐：false）
  # 说明：Windows上预编译的OpenCV通常不支持CUDA
  # - false：CPU预处理（I420架构，性能已优化60%）
  # - true：GPU预处理（需要编译支持CUDA的OpenCV）
  # 当前建议：使用CPU预处理，I420架构性能已经很好（15-20ms）
  use_gpu_preprocess: false

  # RGB均值（用于归一化，默认：[0.0, 0.0, 0.0]）
  # 说明：预处理时的RGB通道均值
  # 大多数YOLO模型使用[0.0, 0.0, 0.0]
  rgb_mean: [0.0, 0.0, 0.0]

  # RGB标准差（用于归一化，默认：[1.0, 1.0, 1.0]）
  # 说明：预处理时的RGB通道标准差
  # 大多数YOLO模型使用[1.0, 1.0, 1.0]
  rgb_std: [1.0, 1.0, 1.0]

  # ========== FFmpeg 滤镜参数（视频预处理）==========
  # FFmpeg 滤镜参数（用于视频预处理）
  # 说明：在解码后、缩放前应用的滤镜，如降噪、锐化等
  # 例如：["noise=c1s=1:allf", "unsharp=5:5:1.0:5:5:0.0"]
  # 空列表：不应用额外滤镜
  ffmpeg_filters: []

# ----------------------------------------
# 任务表动态配置说明
# ----------------------------------------
# 任务表中的 decoder_config 字段可以覆盖上述默认值
# 例如（JSON 格式）：
# {
#   "width": 1920,
#   "height": 1080,
#   "fps": 30,
#   "hwaccel_preset": "preset-dxva2",
#   "input_preset": "preset-rtsp-generic",
#   "ring_buffer_block_count": 15,
#   "index_queue_size": 75,
#   "model_input_size": 640,
#   "use_gpu_preprocess": true,
#   "rgb_mean": [0.0, 0.0, 0.0],
#   "rgb_std": [1.0, 1.0, 1.0],
#   "ffmpeg_filters": ["noise=c1s=1:allf"]  # 降噪滤镜示例
# }
#
# GPU预处理性能优化建议：
# - 如果OpenCV编译时包含CUDA支持，建议启用use_gpu_preprocess
# - GPU预处理可以将预处理耗时从20ms降低到5ms（提升75%）
# - CPU占用降低70%，适合多摄像机并发场景
#
# 优先级：
# 1. 任务表中的配置（最高优先级）
# 2. 本配置文件中的默认值
# 3. DecoderConfig 类中的硬编码默认值（最低优先级）
