# ========================================
# 解码器模块配置文件
# ========================================
#
# 说明：
# - 此文件为解码器全局配置，对所有任务一致
# - 所有参数均以本文件为唯一来源，任务表不再保存解码配置
#
# 架构：环形缓冲区 + 索引队列（零拷贝）
# ========================================

# ----------------------------------------
# 解码器基础配置
# ----------------------------------------
decoder:
  # ========== 视频参数 ==========
  # 解码输出宽度
  width: 640
  
  # 解码输出高度
  height: 640
  
  # 检测帧率（推荐：30）
  # 说明：视频流的常见帧率，可根据实际需求调整
  fps: 25

  # ========== 硬件加速配置 ==========
  # 硬件加速预设（必须使用）
  # 支持的预设（完整列表）：
  #   ✅ NVIDIA GPU（推荐）：
  #     - preset-nvidia: NVIDIA CUDA（通用，推荐）
  #     - preset-nvidia-h264: NVIDIA H.264 专用
  #     - preset-nvidia-h265: NVIDIA H.265 专用
  #     - preset-nvidia-mjpeg: NVIDIA MJPEG 专用
  #
  #   ✅ Windows 通用：
  #     - preset-dxva2: Windows DXVA2（兼容性最好）
  #
  #   ✅ Intel GPU：
  #     - preset-intel-qsv-h264: Intel QSV H.264
  #     - preset-intel-qsv-h265: Intel QSV H.265
  #
  #   ✅ AMD GPU（Linux）：
  #     - preset-vaapi: AMD VAAPI
  #
  #   ✅ 嵌入式平台：
  #     - preset-rk-h264: Rockchip RK3588/RK3566 H.264
  #     - preset-rk-h265: Rockchip RK3588/RK3566 H.265
  #     - preset-jetson-h264: Jetson Nano/Xavier H.264
  #     - preset-jetson-h265: Jetson Nano/Xavier H.265
  #     - preset-rpi-64-h264: Raspberry Pi H.264
  #     - preset-rpi-64-h265: Raspberry Pi H.265
  #
  #   ⚠️ 实验性：
  #     - preset-vulkan: Vulkan（实验性，不推荐生产环境）
  #
  # 空字符串：使用 CPU 解码（不推荐，性能差）
  #
  # ⚠️ 根据您的硬件环境（NVIDIA RTX 2070 + CUDA 12.9），建议使用 "preset-nvidia"
  # 如果遇到兼容性问题，可以回退到 "preset-dxva2"（Windows 通用）
  #
  # 职责分离：解码 preset 在此独立设置，与 detector_config.backend 互不干预。
  #   部署到 RK3588 盒子时，把 detector_config.backend 改为 "rknn"（管预处理+推理），
  #   同时把这里的 hwaccel_preset 改为 "preset-rk-h264"（管解码，启用 RKMPP）。
  hwaccel_preset: "preset-nvidia"

  # ========== 输入预设配置 ==========
  # 输入预设（用于优化 RTSP/HTTP/RTMP 流处理）
  # 支持的预设（完整列表）：
  #   ✅ RTSP 流（推荐）：
  #     - preset-rtsp-generic: RTSP 通用预设（推荐，TCP 传输，稳定优先）
  #     - preset-rtsp-restream: RTSP 重流预设（低延迟，适合本地推流）
  #     - preset-rtsp-restream-low-latency: RTSP 重流低延迟预设（最低延迟）
  #     - preset-rtsp-udp: RTSP UDP 传输（低延迟，需要网络稳定）
  #     - preset-rtsp-blue-iris: RTSP Blue Iris 专用（兼容 Blue Iris 软件）
  #
  #   ✅ HTTP 流：
  #     - preset-http-mjpeg-generic: HTTP MJPEG 流（适合 MJPEG 摄像头）
  #     - preset-http-jpeg-generic: HTTP JPEG 流（适合单帧 JPEG 摄像头）
  #     - preset-http-reolink: HTTP Reolink 专用（兼容 Reolink 摄像头）
  #
  #   ✅ RTMP 流：
  #     - preset-rtmp-generic: RTMP 流（适合 RTMP 推流）
  #
  # 空字符串：使用默认 RTSP 配置（TCP 传输）
  #
  # ⚠️ 推荐使用 "preset-rtsp-generic"（通用性强，稳定性好）
  # 如果遇到网络抖动或丢包问题，可以尝试 "preset-rtsp-udp"（需要网络稳定）
  # 如果需要最低延迟，可以尝试 "preset-rtsp-restream-low-latency"
  input_preset: "preset-rtsp-generic"

  # ========== 输出配置 ==========
  # ✅ 优化：固定使用I420格式（Y+U+V分离），性能提升60%
  # I420格式更适合OpenCV处理，无需Y/UV拼接，预处理性能更优
  # output_format 参数已删除，解码器强制输出I420格式

  # ========== RTSP 配置 ==========
  # RTSP 传输协议
  # - tcp: 传输稳定，适合网络不稳定场景
  # - udp: 传输延迟低，适合局域网稳定场景
  rtsp_transport: "tcp"
  
  # 是否自动重连
  reconnect: true
  
  # 重连延迟（秒）
  reconnect_delay: 5
  
  # 输入缓冲区大小（字节，推荐：2MB）
  # 说明：高码率视频建议增大此值
  buffer_size: 2097152  # 2 * 1024 * 1024

  # ========== 环形缓冲区配置（零拷贝架构）==========
  # 环形缓冲区块数量（推荐：10）
  # 说明：块数量越多，可以缓存的帧越多，避免丢帧
  # 每块大小 = width * height * 1.5（I420 格式）
  # 例如：640x640 I420 = 640 * 640 * 1.5 = 614,400 字节 ≈ 0.6 MB
  #
  # 推荐值：
  #   - 实时性优先（低延迟）：5-8 块（内存占用小，但容易丢帧）
  #   - 稳定性优先（推荐）：10-15 块（内存占用适中，稳定性好）
  #   - 高吞吐量场景：20-30 块（适合高码率视频或多任务并发）
  #
  # ⚠️ 内存占用计算：block_count * width * height * 1.5
  # 例如：10 块 * 640 * 640 * 1.5 = 6 MB
  ring_buffer_block_count: 10

  # 索引队列大小（推荐：50）
  # 说明：索引队列用于调度和同步，只存储索引（序列号、块ID、时间戳）
  # 不存储实际帧数据，内存占用极小（每个索引约 32 字节）
  #
  # 推荐值：ring_buffer_block_count * 5（例如：10 * 5 = 50）
  # - 太小：容易丢帧（生产速度 > 消费速度时）
  # - 太大：增加延迟（但不会丢失帧）
  #
  # ⚠️ 内存占用计算：queue_size * 32 字节（几乎可忽略）
  index_queue_size: 50

  # ========== FFmpeg 滤镜参数（视频预处理）==========
  # FFmpeg 滤镜参数（用于视频预处理）
  # 说明：在解码后、缩放前应用的滤镜，如降噪、锐化等
  # 例如：["noise=c1s=1:allf", "unsharp=5:5:1.0:5:5:0.0"]
  # 空列表：不应用额外滤镜
  #
  # 注意：以下参数已移除（实际配置来源）：
  # - model_input_size: 从算法库获取（algorithm.input_width/height）
  # - use_gpu_preprocess: 从检测器配置获取（detector_config.yaml）
  # - rgb_mean/rgb_std: 从算法库获取（algorithm.rgb_mean/std）
  ffmpeg_filters: []

