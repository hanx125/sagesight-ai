# ========================================
# 解码器模块配置文件
# ========================================
#
# 说明：
# - 此文件仅包含解码器相关的配置参数
# ========================================
# ----------------------------------------
# 摄像机接入配置（用于测试，已经禁用）
# ----------------------------------------
# camera:
#   # 摄像机基础信息
#   camera_id: "test_001"
#   camera_name: "测试摄像机"
#
#   # 视频源配置（RTSP流 或 本地视频文件，二选一）
#   # 方式1: RTSP流地址
#   rtsp_url: "rtsp://admin:password@192.168.1.100:554/h264/ch1/main/av_stream"
#
#   # 方式2: 本地视频文件（测试用）
#   # video_file: "test_video.mp4"
# ----------------------------------------
# 解码器基础配置
# ----------------------------------------
decoder:
  # 解码输出宽度
  width: 640
  
  # 解码输出高度
  height: 640
  
  # 硬件加速方式
  # - dxva2: Windows Direct-X Video Acceleration（推荐 Windows）
  # - cuda: NVIDIA CUDA 硬件加速（需要 NVIDIA GPU）
  # - qsv: Intel Quick Sync Video（需要 Intel CPU）
  # - none: 纯软件解码（CPU 占用高，不建议）
  hwaccel: "dxva2"

  # 输出格式（像素格式）
  # - nv12: NV12 格式（现代硬件原生格式，性能最优，推荐用于 DXVA2/CUDA/QSV）
  # - yuv420p: YUV420p 格式（传统格式，兼容性好，适合 CPU 解码）
  # - auto: 根据硬件加速自动选择（DXVA2→NV12，CUDA→NV12，QSV→NV12，CPU→YUV420p）
  output_format: "auto"

  # RTSP 传输协议
  # - tcp: 传输稳定，适合网络不稳定场景
  # - udp: 传输延迟低，适合局域网稳定场景
  rtsp_transport: "tcp"
  
  # 是否自动重连
  reconnect: true
  
  # 重连延迟（秒）
  reconnect_delay: 5
  
  # 输入缓冲区大小（字节）
  buffer_size: 1048576
  
  # ========================================
  # 新架构：环形缓冲区 + 索引队列（零拷贝）
  # ========================================
  # 说明：启用此架构可以实现真正的零拷贝和数据解耦
  # 优势：
  #   - 零拷贝：SharedMemory负责数据传输，FrameQueue负责调度
  #   - 环形缓冲区：多帧存储，新帧不覆盖正在读取的帧
  #   - 索引队列：只存储索引，不存储完整数据，内存占用低
  #   - 生产者-消费者解耦：数据和调度分离
  # 
  # 性能对比：
  #   - 新架构：0次内存拷贝，高并发，低延迟
  #   - 旧架构：0次内存拷贝（SharedMemory零拷贝），但单帧存储
  use_ring_buffer: true  # 启用新架构

  # 环形缓冲区块数量（推荐值：3-10）
  # 说明：块数量越多，可以缓存的帧越多，但内存占用越大
  # - 太少：容易丢帧（检测速度跟不上时）
  # - 太多：内存占用增加，但更稳定
  # 推荐值：
  #   - 实时性优先：3-5块
  #   - 稳定性优先：8-10块
  ring_buffer_block_count: 5

  # 索引队列大小（推荐值：10-50）
  # 说明：索引队列用于调度和同步，只存储索引（不存储数据）
  # - 太小：容易丢帧
  # - 太大：增加延迟（但不会丢失帧）
  # 推荐值：30-50
  index_queue_size: 30

# ----------------------------------------
# 帧队列配置（动态配置）
# ----------------------------------------
frame_queue:
  # 帧队列大小
  # - 决定解码器和推理器之间的缓冲能力
  # - 较大值可平滑解码抖动，但会增加延迟
  # - 较小值可降低延迟，但可能导致丢帧
  # - 推荐值：15-30
  size: 30

# ----------------------------------------
# 共享内存配置（动态配置）
# ----------------------------------------
shared_memory:
  # 共享内存大小（字节）
  # - None: 自动计算（YUV420p 格式，640x640 = 614420 字节）
  # - 自定义值：例如 614420（640x640 YUV420p）
  # - 计算公式：HEADER_SIZE(20) + width * height * 1.5
  total_size: null  # null 表示自动计算
  
  # 版本不匹配时的最大重试次数
  # - 用于防止读到半帧数据（序列号不一致）
  # - 推荐值：3-5
  max_retries: 3

# ========================================
# 注意：测试工具专用配置已迁移
